<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>VNC Viewer</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- 连接对话框 -->
  <div id="connection-dialog" class="dialog-overlay">
    <div class="dialog">
      <div class="dialog-header">
        <h1>VNC Viewer</h1>
        <p class="subtitle">跨平台远程桌面 - 参考 UltraVNC 实现</p>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label for="host">服务器地址</label>
          <input type="text" id="host" placeholder="例如: 192.168.1.100" value="127.0.0.1">
        </div>
        <div class="form-row">
          <div class="form-group flex-2">
            <label for="port">端口</label>
            <input type="number" id="port" value="5900" min="1" max="65535">
          </div>
          <div class="form-group flex-1">
            <label for="display">显示编号</label>
            <input type="number" id="display" value="0" min="0" max="99">
          </div>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="VNC 认证密码（可选）">
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="shared" checked>
            <span class="checkmark"></span>
            共享模式（不独占服务器）
          </label>
        </div>
        <div class="error-msg" id="error-msg"></div>
      </div>
      <div class="dialog-footer">
        <button class="btn btn-primary" id="connect-btn">连接</button>
      </div>
    </div>
  </div>

  <!-- 连接状态栏 -->
  <div id="status-bar" class="status-bar hidden">
    <div class="status-left">
      <span class="status-indicator" id="status-indicator"></span>
      <span id="status-text">就绪</span>
    </div>
    <div class="status-center" id="status-center">
      <span id="server-info-text">未连接</span>
    </div>
    <div class="status-right">
      <span id="quality-text"></span>
      <span id="zoom-text">100%</span>
    </div>
  </div>

  <!-- 实时日志面板 -->
  <div id="log-panel" class="log-panel hidden">
    <div class="log-header">
      <span>实时日志</span>
      <div class="log-actions">
        <button class="log-btn" id="btn-log-clear" title="清空日志">清空</button>
        <button class="log-btn" id="btn-log-close" title="关闭">✕</button>
      </div>
    </div>
    <div class="log-body" id="log-body"></div>
    <div class="log-footer">
      <label class="log-auto-scroll">
        <input type="checkbox" id="log-autoscroll" checked> 自动滚动
      </label>
    </div>
  </div>

  <!-- 工具栏 -->
  <div id="toolbar" class="toolbar hidden">
    <button class="toolbar-btn" id="btn-new-conn" title="新建连接 (Ctrl+N)">
      <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2H9v5a1 1 0 1 1-2 0V9H2a1 1 0 0 1 0-2h5V2a1 1 0 0 1 1-1z"/></svg>
    </button>
    <button class="toolbar-btn" id="btn-disconnect" title="断开连接 (Ctrl+D)">
      <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" id="btn-zoom-fit" title="缩放至窗口 (Ctrl+0)">
      <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M1.5 1A1.5 1.5 0 0 0 0 2.5v2a.5.5 0 0 0 1 0v-2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 0 0-1h-2zm5 0a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zm-5 12a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zm5 0a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zM1 13.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 1.5 15h2a.5.5 0 0 0 0-1h-2a.5.5 0 0 1-.5-.5zM15 1.5A1.5 1.5 0 0 0 13.5 0h-2a.5.5 0 0 0 0 1h2a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2zM14 13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 0 0 1h2a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/></svg>
    </button>
    <button class="toolbar-btn" id="btn-zoom-100" title="实际大小 (Ctrl+1)">
      <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M6.5 8a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1h-4zm-3-4a.5.5 0 0 0 0 1h.5v1.5a.5.5 0 0 0 1 0V5h1.5a.5.5 0 0 0 0-1H5V3.5a.5.5 0 0 0-1 0V4H3.5zm0 8a.5.5 0 0 0 0 1h.5v1.5a.5.5 0 0 0 1 0V13h1.5a.5.5 0 0 0 0-1H5v-1.5a.5.5 0 0 0-1 0V12H3.5z"/></svg>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" id="btn-fullscreen" title="全屏 (Ctrl+Shift+F)">
      <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 0 1 0V2h3.5a.5.5 0 0 0 0-1h-4zm13 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V2h-3.5a.5.5 0 0 1 0-1h4zM1 10.5a.5.5 0 0 1 .5.5V14h3.5a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5zm14 0a.5.5 0 0 0-.5.5V14h-3.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 0-.5-.5z"/></svg>
    </button>
    <button class="toolbar-btn" id="btn-ctrl-alt-del" title="发送 Ctrl+Alt+Del">
      <span style="font-size: 10px; font-weight: bold;">CAD</span>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" id="btn-clipboard" title="剪贴板">
      <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path fill="currentColor" d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" id="btn-log" title="实时日志 (Ctrl+L)">
      <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M2 2h12v12H2V2zm1 1v10h10V3H3zm2 2h6v1H5V5zm0 3h6v1H5V8zm0 3h4v1H5v-1z"/></svg>
    </button>
  </div>

  <!-- VNC 视口 -->
  <div id="viewport-container" class="viewport-container">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg width="64" height="64" viewBox="0 0 64 64"><path fill="currentColor" opacity="0.3" d="M8 8h48v48H8V8z" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" opacity="0.3" d="M16 16h32v32H16V16z"/><path fill="currentColor" opacity="0.5" d="M24 24h16v16H24V24z"/><circle cx="32" cy="32" r="4" fill="currentColor" opacity="0.7"/><path fill="currentColor" opacity="0.2" d="M4 56l8-8h48l-8 8H4z"/></svg>
      </div>
      <h2>VNC Viewer</h2>
      <p>点击「新建连接」或按 <kbd>Ctrl+N</kbd> 开始</p>
    </div>
    <canvas id="vnc-canvas"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>
