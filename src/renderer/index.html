<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>VNC Viewer</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- 连接对话框 -->
  <div id="connection-dialog" class="dialog-overlay">
    <div class="dialog">
      <div class="dialog-brand">
        <svg class="brand-logo" width="56" height="56" viewBox="0 0 1024 1024" aria-hidden="true">
          <defs>
            <linearGradient id="brandBg" x1="0" y1="0" x2="0.35" y2="1">
              <stop offset="0" stop-color="#3730A3"/>
              <stop offset="0.55" stop-color="#2563EB"/>
              <stop offset="1" stop-color="#0891B2"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#brandBg)"/>
          <rect x="242" y="272" width="540" height="340" rx="46" fill="#FFFFFF"/>
          <rect x="272" y="302" width="480" height="280" rx="30" fill="#0C2D5E"/>
          <g fill="none" stroke="#22D3EE" stroke-width="18" stroke-linecap="round">
            <path d="M 431.4 377.4 A 114 114 0 0 1 592.6 377.4" opacity="0.45"/>
            <path d="M 455.4 401.4 A 80 80 0 0 1 568.6 401.4" opacity="0.72"/>
            <path d="M 479.5 425.5 A 46 46 0 0 1 544.5 425.5" opacity="1"/>
          </g>
          <circle cx="512" cy="458" r="21" fill="#22D3EE"/>
          <path d="M 462 612 L 562 612 L 544 668 L 480 668 Z" fill="#FFFFFF"/>
          <rect x="424" y="668" width="176" height="30" rx="15" fill="#FFFFFF"/>
        </svg>
        <h1>VNC Viewer</h1>
        <p class="subtitle">远程桌面</p>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label for="host">服务器</label>
          <input type="text" id="host" placeholder="地址[:端口]" value="dify" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="VNC 密码（可选）" value="dify123" autocomplete="off">
        </div>
        <button type="button" id="options-toggle" class="options-toggle" aria-expanded="false">
          <span>选项</span>
          <svg width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M1 3l4 4 4-4z"/></svg>
        </button>
        <div id="options-panel" class="options-panel hidden">
          <div class="form-row">
            <div class="form-group">
              <label for="port">端口</label>
              <input type="number" id="port" value="5900" min="1" max="65535">
            </div>
            <div class="form-group">
              <label for="display">显示编号</label>
              <input type="number" id="display" value="0" min="0" max="99">
            </div>
          </div>
          <div class="form-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="shared" checked>
              <span class="checkmark"></span>
              共享模式（不独占服务器）
            </label>
          </div>
        </div>
        <div class="error-msg" id="error-msg"></div>
      </div>
      <div class="dialog-footer">
        <button class="btn btn-primary btn-block" id="connect-btn">连接</button>
      </div>
    </div>
  </div>

  <!-- 悬浮工具栏（空闲自动隐藏，参考 Chrome Remote Desktop / TigerVNC） -->
  <div id="toolbar" class="toolbar toolbar-hidden hidden">
    <div class="toolbar-status">
      <span class="status-indicator" id="status-indicator"></span>
      <span id="status-text">就绪</span>
      <span class="server-info" id="server-info-text"></span>
      <span class="stats-text" id="stats-text"></span>
    </div>
    <div class="toolbar-actions">
      <button class="toolbar-btn" id="btn-new-conn" title="新建连接 (Ctrl+N)">
        <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2H9v5a1 1 0 1 1-2 0V9H2a1 1 0 0 1 0-2h5V2a1 1 0 0 1 1-1z"/></svg>
      </button>
      <button class="toolbar-btn" id="btn-disconnect" title="断开连接 (Ctrl+D)">
        <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg>
      </button>
      <span class="toolbar-separator"></span>
      <button class="toolbar-btn" id="btn-zoom-toggle" title="缩放：适配窗口 / 实际大小 (Ctrl+0 / Ctrl+1)">
        <svg id="zoom-icon-fit" width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M1.5 1A1.5 1.5 0 0 0 0 2.5v2a.5.5 0 0 0 1 0v-2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 0 0-1h-2zm5 0a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zm-5 12a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zm5 0a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zM1 13.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 1.5 15h2a.5.5 0 0 0 0-1h-2a.5.5 0 0 1-.5-.5zM15 1.5A1.5 1.5 0 0 0 13.5 0h-2a.5.5 0 0 0 0 1h2a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2zM14 13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 0 0 1h2a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/></svg>
        <svg id="zoom-icon-100" class="hidden" width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M6.5 8a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1h-4zm-3-4a.5.5 0 0 0 0 1h.5v1.5a.5.5 0 0 0 1 0V5h1.5a.5.5 0 0 0 0-1H5V3.5a.5.5 0 0 0-1 0V4H3.5zm0 8a.5.5 0 0 0 0 1h.5v1.5a.5.5 0 0 0 1 0V13h1.5a.5.5 0 0 0 0-1H5v-1.5a.5.5 0 0 0-1 0V12H3.5z"/></svg>
        <span id="zoom-text">100%</span>
      </button>
      <button class="toolbar-btn" id="btn-window-fit" title="窗口适应远端 (Ctrl+2)">
        <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707zm4.344 0a.5.5 0 0 1 .707 0l4.096 4.096V11.5a.5.5 0 1 1 1 0v3.975a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1 0-1h2.768l-4.096-4.096a.5.5 0 0 1 0-.707zm0-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707zm-4.344 0a.5.5 0 0 1-.707 0L1.025 1.732V4.5a.5.5 0 0 1-1 0V.525a.5.5 0 0 1 .5-.5H4.5a.5.5 0 0 1 0 1H1.732l4.096 4.096a.5.5 0 0 1 0 .707z"/></svg>
      </button>
      <button class="toolbar-btn" id="btn-fullscreen" title="全屏 (Ctrl+Shift+F)">
        <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 0 1 0V2h3.5a.5.5 0 0 0 0-1h-4zm13 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V2h-3.5a.5.5 0 0 1 0-1h4zM1 10.5a.5.5 0 0 1 .5.5V14h3.5a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5zm14 0a.5.5 0 0 0-.5.5V14h-3.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 0-.5-.5z"/></svg>
      </button>
      <button class="toolbar-btn" id="btn-more" title="更多">
        <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M4 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm5.5 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM15 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/></svg>
      </button>
      <!-- 更多菜单（折叠次要功能） -->
      <div id="more-menu" class="more-menu hidden">
        <button class="more-item" id="btn-ctrl-alt-del">发送 Ctrl+Alt+Del</button>
        <button class="more-item" id="btn-clipboard">发送剪贴板文本…</button>
        <div class="more-sep"></div>
        <button class="more-item" id="btn-log">实时日志</button>
        <button class="more-item" id="btn-settings">设置…</button>
      </div>
    </div>
  </div>

  <!-- VNC 视口 -->
  <div id="viewport-container" class="viewport-container">
    <div class="empty-state" id="empty-state">
      <svg class="empty-logo" width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true">
        <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#brandBg)"/>
        <rect x="242" y="272" width="540" height="340" rx="46" fill="#FFFFFF"/>
        <rect x="272" y="302" width="480" height="280" rx="30" fill="#0C2D5E"/>
        <g fill="none" stroke="#22D3EE" stroke-width="18" stroke-linecap="round">
          <path d="M 431.4 377.4 A 114 114 0 0 1 592.6 377.4" opacity="0.45"/>
          <path d="M 455.4 401.4 A 80 80 0 0 1 568.6 401.4" opacity="0.72"/>
          <path d="M 479.5 425.5 A 46 46 0 0 1 544.5 425.5" opacity="1"/>
        </g>
        <circle cx="512" cy="458" r="21" fill="#22D3EE"/>
        <path d="M 462 612 L 562 612 L 544 668 L 480 668 Z" fill="#FFFFFF"/>
        <rect x="424" y="668" width="176" height="30" rx="15" fill="#FFFFFF"/>
      </svg>
      <h2>VNC Viewer</h2>
      <p class="empty-sub">简洁的跨平台远程桌面</p>
      <button class="btn btn-primary" id="btn-empty-connect">新建连接</button>
      <p class="hint">或按 <kbd>Ctrl+N</kbd></p>
    </div>
    <canvas id="vnc-canvas" tabindex="0"></canvas>
  </div>

  <!-- 实时日志面板 -->
  <div id="log-panel" class="log-panel hidden">
    <div class="log-header">
      <span>实时日志</span>
      <div class="log-actions">
        <button class="log-btn" id="btn-log-clear" title="清空日志">清空</button>
        <button class="log-btn" id="btn-log-close" title="关闭">✕</button>
      </div>
    </div>
    <div class="log-body" id="log-body"></div>
    <div class="log-footer">
      <label class="log-auto-scroll">
        <input type="checkbox" id="log-autoscroll" checked> 自动滚动
      </label>
    </div>
  </div>

  <!-- 设置对话框 -->
  <div id="settings-dialog" class="dialog-overlay hidden">
    <div class="dialog dialog-sm">
      <div class="dialog-header">
        <h1>设置</h1>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label for="settings-mobile-port">手机代理端口</label>
          <input type="number" id="settings-mobile-port" value="5933" min="1024" max="65535">
          <p class="form-hint">修改后立即生效，手机浏览器需使用新端口访问</p>
        </div>
        <div class="error-msg" id="settings-error-msg"></div>
      </div>
      <div class="dialog-footer dialog-footer-row">
        <button class="btn" id="btn-settings-cancel">取消</button>
        <button class="btn btn-primary" id="btn-settings-save">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
