<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>VNC Viewer - 移动版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  overflow: hidden;
  height: 100dvh;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* 连接面板 */
#connect-panel {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  z-index: 100;
}
#connect-panel.hidden { display: none; }
.connect-card {
  width: 100%;
  max-width: 360px;
  background: rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 32px 24px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
}
.connect-card h1 {
  font-size: 22px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 4px;
  color: #fff;
}
.connect-card p.subtitle {
  font-size: 13px;
  color: #888;
  text-align: center;
  margin-bottom: 24px;
}
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 13px;
  color: #aaa;
  margin-bottom: 6px;
  font-weight: 500;
}
.form-group input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus { border-color: #4a9eff; }
.form-group input::placeholder { color: #555; }
.form-row {
  display: flex;
  gap: 12px;
}
.form-row .form-group { flex: 1; }
.form-row .form-group:last-child { flex: 0 0 100px; }

.btn-connect {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #4a9eff, #6366f1);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  margin-top: 8px;
}
.btn-connect:active { transform: scale(0.97); opacity: 0.85; }
.btn-connect:disabled { opacity: 0.5; }

#status-text {
  text-align: center;
  font-size: 13px;
  margin-top: 12px;
  color: #888;
  min-height: 20px;
}
#status-text.error { color: #ff6b6b; }
#status-text.connected { color: #51cf66; }

/* 工具栏 */
#toolbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 44px;
  background: rgba(26,26,46,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  z-index: 50;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  transition: transform 0.3s ease;
}
#toolbar.hidden { transform: translateY(-100%); }
.toolbar-title {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  color: #ccc;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.toolbar-btn {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 8px;
  background: rgba(255,255,255,0.08);
  color: #ccc;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.toolbar-btn:active { background: rgba(255,255,255,0.16); }
.toolbar-btn.disconnect { color: #ff6b6b; }

/* 画布 */
#canvas-wrapper {
  position: fixed;
  inset: 0;
  top: 0;
  overflow: hidden;
  background: #000;
}
#vnc-canvas {
  display: block;
  image-rendering: pixelated;
  -ms-interpolation-mode: nearest-neighbor;
}
.cursor-layer {
  position: absolute;
  pointer-events: none;
  z-index: 50;
  image-rendering: pixelated;
  -ms-interpolation-mode: nearest-neighbor;
  transform-origin: top left;
}
.cursor-layer.hidden { display: none; }

/* 缩放指示器 */
#zoom-indicator {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 12px;
  color: #ccc;
  z-index: 40;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
#zoom-indicator.show { opacity: 1; }

/* 键盘面板 */
#keyboard-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(26,26,46,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 8px;
  z-index: 50;
  transition: transform 0.3s ease;
}
#keyboard-panel.hidden { transform: translateY(100%); }
.kb-row {
  display: flex;
  gap: 4px;
  margin-bottom: 4px;
  justify-content: center;
}
.kb-row:last-child { margin-bottom: 0; }
.kb-key {
  height: 36px;
  min-width: 36px;
  border: none;
  border-radius: 6px;
  background: rgba(255,255,255,0.1);
  color: #ddd;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.kb-key:active { background: rgba(255,255,255,0.2); }
.kb-key.special { background: rgba(255,255,255,0.06); color: #888; font-size: 11px; }
.kb-key.modifier { background: rgba(74,158,255,0.15); color: #4a9eff; }
.kb-key.modifier.active { background: rgba(74,158,255,0.35); }
.kb-key.ctrl-alt-del { background: rgba(255,107,107,0.15); color: #ff6b6b; }
.kb-space { flex: 4; }

/* 日志面板 */
#log-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 50vh;
  background: rgba(10,10,20,0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.08);
  z-index: 60;
  transition: transform 0.3s ease;
  display: flex;
  flex-direction: column;
}
#log-panel.hidden { transform: translateY(100%); }
.log-header {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  gap: 8px;
  flex-shrink: 0;
}
.log-header span { font-size: 13px; font-weight: 600; color: #ccc; flex: 1; }
.log-header button {
  padding: 4px 10px;
  background: rgba(255,255,255,0.08);
  border: none;
  border-radius: 6px;
  color: #aaa;
  font-size: 12px;
  cursor: pointer;
}
.log-header button:active { background: rgba(255,255,255,0.16); }
.log-body {
  flex: 1;
  overflow-y: auto;
  padding: 6px 10px;
  font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
  font-size: 11px;
  line-height: 1.5;
  -webkit-overflow-scrolling: touch;
  max-height: calc(50vh - 40px);
}
.log-line {
  display: flex;
  gap: 6px;
  word-break: break-all;
  padding: 1px 0;
}
.log-time { color: #666; flex-shrink: 0; }
.log-level { flex-shrink: 0; font-weight: 700; width: 32px; }
.log-info .log-level { color: #4a9eff; }
.log-warn .log-level { color: #ffa502; }
.log-error .log-level { color: #ff6b6b; }
.log-msg { color: #ccc; }
.log-warn .log-msg { color: #ffa502; }
.log-error .log-msg { color: #ff6b6b; }
</style>
</head>
<body>

<!-- 连接面板 -->
<div id="connect-panel">
  <div class="connect-card">
    <h1>VNC Viewer</h1>
    <p class="subtitle">连接远程桌面</p>
    <div class="form-group">
      <label>服务器地址</label>
      <input type="text" id="input-host" placeholder="192.168.1.100" autocomplete="off">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>端口</label>
        <input type="number" id="input-port" placeholder="5900" value="5900">
      </div>
      <div class="form-group">
        <label>显示编号</label>
        <input type="number" id="input-display" placeholder="0" value="0" min="0" max="99">
      </div>
    </div>
    <div class="form-group">
      <label>密码 (可选)</label>
      <input type="password" id="input-password" placeholder="VNC 密码">
    </div>
    <button class="btn-connect" id="btn-connect" onclick="doConnect()">连接</button>
    <div id="status-text">输入服务器地址开始连接</div>
  </div>
</div>

<!-- 工具栏 -->
<div id="toolbar" class="hidden">
  <button class="toolbar-btn" onclick="toggleKeyboard()" title="键盘">⌨</button>
  <span class="toolbar-title" id="toolbar-title">未连接</span>
  <button class="toolbar-btn" onclick="toggleLogPanel()" title="日志">📋</button>
  <button class="toolbar-btn" onclick="toggleZoom()" title="缩放适应">⊞</button>
  <button class="toolbar-btn disconnect" onclick="disconnect()" title="断开">✕</button>
</div>

<!-- 画布 -->
<div id="canvas-wrapper">
  <canvas id="vnc-canvas"></canvas>
  <canvas id="cursor-canvas" class="cursor-layer hidden"></canvas>
</div>

<!-- 缩放指示 -->
<div id="zoom-indicator">100%</div>

<!-- 键盘面板 -->
<div id="keyboard-panel" class="hidden">
  <div class="kb-row">
    <button class="kb-key modifier" data-key="Ctrl" data-mod="ctrl">Ctrl</button>
    <button class="kb-key modifier" data-key="Alt" data-mod="alt">Alt</button>
    <button class="kb-key modifier" data-key="Meta" data-mod="meta">Cmd</button>
    <button class="kb-key modifier" data-key="Shift" data-mod="shift">Shift</button>
  </div>
  <div class="kb-row">
    <button class="kb-key special" data-key="Escape">Esc</button>
    <button class="kb-key special" data-key="Tab">Tab</button>
    <button class="kb-key" data-key="Backspace">⌫</button>
    <button class="kb-key" data-key="Enter">↵</button>
  </div>
  <div class="kb-row">
    <button class="kb-key" data-key="F1">F1</button>
    <button class="kb-key" data-key="F2">F2</button>
    <button class="kb-key" data-key="F3">F3</button>
    <button class="kb-key" data-key="F4">F4</button>
    <button class="kb-key" data-key="F5">F5</button>
    <button class="kb-key" data-key="F6">F6</button>
    <button class="kb-key" data-key="F7">F7</button>
    <button class="kb-key" data-key="F8">F8</button>
    <button class="kb-key" data-key="F9">F9</button>
    <button class="kb-key" data-key="F10">F10</button>
    <button class="kb-key" data-key="F11">F11</button>
    <button class="kb-key" data-key="F12">F12</button>
  </div>
  <div class="kb-row">
    <button class="kb-key ctrl-alt-del" data-key="CtrlAltDel">Ctrl+Alt+Del</button>
  </div>
</div>

<script>
// ====== RFB Keysym 映射 (X11) ======
const KEYSYM = {
  'Backspace': 0xff08, 'Tab': 0xff09, 'Enter': 0xff0d, 'Escape': 0xff1b,
  'F1': 0xffbe, 'F2': 0xffbf, 'F3': 0xffc0, 'F4': 0xffc1,
  'F5': 0xffc2, 'F6': 0xffc3, 'F7': 0xffc4, 'F8': 0xffc5,
  'F9': 0xffc6, 'F10': 0xffc7, 'F11': 0xffc8, 'F12': 0xffc9,
  'Shift': 0xffe1, 'Ctrl': 0xffe3, 'Alt': 0xffe9, 'Meta': 0xffeb,
  'CtrlAltDel': 0xffff,
};

// ====== DES 实现 (VNC 认证) ======
class DES {
  constructor(key) {
    const keyBytes = new Uint8Array(8);
    for (let i = 0; i < 8 && i < key.length; i++) {
      keyBytes[i] = key.charCodeAt(i);
    }
    this._keySchedule(keyBytes);
  }
  _pc1 = [56,48,40,32,24,16,8,0,57,49,41,33,25,17,9,1,58,50,42,34,26,18,10,2,59,51,43,35,62,54,46,38,30,22,14,6,61,53,45,37,29,21,13,5,60,52,44,36,28,20,12,4,27,19,11,3];
  _pc2 = [13,16,10,23,0,4,2,27,14,5,20,9,22,18,11,3,25,7,15,6,26,19,12,1,40,51,30,36,46,54,29,39,50,44,32,47,43,48,38,55,33,52,45,41,49,35,28,31];
  _rotations = [1,1,2,2,2,2,2,2,1,2,2,2,2,2,2,1];
  _ip = [57,49,41,33,25,17,9,1,59,51,43,35,27,19,11,3,61,53,45,37,29,21,13,5,63,55,47,39,31,23,15,7,56,48,40,32,24,16,8,0,58,50,42,34,26,18,10,2,60,52,44,36,28,20,12,4,62,54,46,38,30,22,14,6];
  _e = [31,0,1,2,3,4,3,4,5,6,7,8,7,8,9,10,11,12,11,12,13,14,15,16,15,16,17,18,19,20,19,20,21,22,23,24,23,24,25,26,27,28,27,28,29,30,31,0];
  _sbox = [
    [14,4,13,1,2,15,11,8,3,10,6,12,5,9,0,7,0,15,7,4,14,2,13,1,10,6,12,11,9,5,3,8],
    [15,1,8,14,6,11,3,4,9,7,2,13,12,0,5,10,3,13,4,7,15,2,8,14,12,0,1,10,6,9,11,5],
    [0,14,7,11,10,4,13,1,5,8,12,6,9,3,2,15,13,8,10,1,3,15,4,2,11,6,7,12,0,5,14,9],
    [10,0,9,14,6,3,15,5,1,13,12,7,11,4,2,8,13,7,0,9,3,4,6,10,2,8,5,14,12,11,15,1],
    [13,6,4,9,8,15,3,0,11,1,2,12,5,10,14,7,1,10,13,0,6,9,8,7,4,15,14,3,11,5,2,12],
    [7,13,14,3,0,6,9,10,1,2,8,5,11,12,4,15,13,8,11,5,6,15,0,3,4,7,2,12,1,10,14,9],
    [10,6,9,0,12,11,7,13,15,1,3,14,5,2,8,4,3,15,0,6,10,1,13,8,9,4,5,11,12,7,2,14],
    [13,7,0,9,3,4,6,10,2,8,5,14,12,11,15,1,1,10,13,0,6,9,8,7,4,15,14,3,11,5,2,12],
  ];
  _p = [15,6,19,20,28,11,27,16,0,14,22,25,4,17,30,9,1,7,23,13,31,26,2,8,18,12,29,5,21,10,3,24];
  _fp = [39,7,47,15,55,23,63,31,38,6,46,14,54,22,62,30,37,5,45,13,53,21,61,29,36,4,44,12,52,20,60,28,35,3,43,11,51,19,59,27,34,2,42,10,50,18,58,26,33,1,41,9,49,17,57,25,32,0,40,8,48,16,56,24];

  _keySchedule(key) {
    const permuted = new Uint8Array(56);
    for (let i = 0; i < 56; i++) permuted[i] = key[this._pc1[i]];
    const C = new Uint8Array(28);
    const D = new Uint8Array(28);
    for (let i = 0; i < 28; i++) { C[i] = permuted[i]; D[i] = permuted[28 + i]; }
    this.subkeys = [];
    for (let round = 0; round < 16; round++) {
      const rot = this._rotations[round];
      this._rotateLeft(C, rot);
      this._rotateLeft(D, rot);
      const combined = new Uint8Array(56);
      combined.set(C); combined.set(D, 28);
      const subkey = new Uint8Array(48);
      for (let i = 0; i < 48; i++) subkey[i] = combined[this._pc2[i]];
      this.subkeys.push(subkey);
    }
  }
  _rotateLeft(arr, n) {
    for (let r = 0; r < n; r++) {
      const first = arr[0];
      for (let i = 0; i < arr.length - 1; i++) arr[i] = arr[i + 1];
      arr[arr.length - 1] = first;
    }
  }
  encrypt(block) {
    const permuted = new Uint8Array(64);
    for (let i = 0; i < 64; i++) permuted[i] = block[this._ip[i]];
    let L = permuted.slice(0, 32);
    let R = permuted.slice(32, 64);
    for (let round = 0; round < 16; round++) {
      const expanded = new Uint8Array(48);
      for (let i = 0; i < 48; i++) expanded[i] = this._e[i] < 32 ? R[this._e[i]] : R[this._e[i] - 32];
      const xored = new Uint8Array(48);
      for (let i = 0; i < 48; i++) xored[i] = expanded[i] ^ this.subkeys[round][i];
      const substituted = new Uint8Array(32);
      for (let i = 0; i < 8; i++) {
        const chunk = xored.slice(i * 6, (i + 1) * 6);
        const row = (chunk[0] << 1) | chunk[5];
        const col = (chunk[1] << 3) | (chunk[2] << 2) | (chunk[3] << 1) | chunk[4];
        const val = this._sbox[i][row * 16 + col];
        for (let j = 0; j < 4; j++) substituted[i * 4 + j] = (val >> (3 - j)) & 1;
      }
      const permutedSub = new Uint8Array(32);
      for (let i = 0; i < 32; i++) permutedSub[i] = substituted[this._p[i]];
      const newR = new Uint8Array(32);
      for (let i = 0; i < 32; i++) newR[i] = L[i] ^ permutedSub[i];
      L = R;
      R = newR;
    }
    const combined = new Uint8Array(64);
    combined.set(R); combined.set(L, 32);
    const result = new Uint8Array(64);
    for (let i = 0; i < 64; i++) result[i] = combined[this._fp[i]];
    return result;
  }
}

// ====== VNC 认证 ======
function vncAuth(password, challenge) {
  // 补齐密码到 8 字节
  const padded = (password + '\0\0\0\0\0\0\0\0').slice(0, 8);
  // 翻转密钥字节顺序 (VNC 使用反向字节序)
  const key = new Uint8Array(8);
  for (let i = 0; i < 8; i++) {
    const c = padded.charCodeAt(i);
    key[i] = ((c << 1) & 0xfe) | ((c >> 7) & 1);
    // 每个字节奇偶校验
    let p = key[i];
    p ^= p >> 4; p ^= p >> 2; p ^= p >> 1;
    if ((p & 1) === 0) key[i] |= 0x01;
    else key[i] &= 0xfe;
  }
  const des = new DES(key);
  const bits = new Uint8Array(64);
  for (let i = 0; i < 8; i++) {
    for (let j = 0; j < 8; j++) {
      bits[i * 8 + j] = (challenge[i] >> (7 - j)) & 1;
    }
  }
  const encrypted = des.encrypt(bits);
  const result = new Uint8Array(8);
  for (let i = 0; i < 8; i++) {
    let byte = 0;
    for (let j = 0; j < 8; j++) {
      byte |= encrypted[i * 8 + j] << (7 - j);
    }
    result[i] = byte;
  }
  return result;
}

// ====== 全局日志 ======
const logBuffer = [];
const MAX_LOG = 200;
function log(level, msg) {
  const t = new Date();
  const time = t.toTimeString().slice(0, 8);
  logBuffer.push({ time, level, msg });
  if (logBuffer.length > MAX_LOG) logBuffer.splice(0, logBuffer.length - MAX_LOG);
  // 更新已打开的日志面板
  const body = document.getElementById('log-body');
  if (body && !document.getElementById('log-panel').classList.contains('hidden')) {
    appendLogLine({ time, level, msg });
  }
}
function appendLogLine(entry) {
  const body = document.getElementById('log-body');
  if (!body) return;
  const line = document.createElement('div');
  line.className = 'log-line log-' + entry.level;
  line.innerHTML = '<span class="log-time">' + entry.time + '</span><span class="log-level">' + entry.level.toUpperCase() + '</span><span class="log-msg">' + escapeHtml(entry.msg) + '</span>';
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toggleLogPanel() {
  const panel = document.getElementById('log-panel');
  const hidden = panel.classList.contains('hidden');
  panel.classList.toggle('hidden', !hidden);
  if (hidden) {
    const body = document.getElementById('log-body');
    body.innerHTML = '';
    for (const e of logBuffer) appendLogLine(e);
  }
}
function clearLogs() {
  logBuffer.length = 0;
  document.getElementById('log-body').innerHTML = '';
}

// ====== 编码解码器 ======
class Encodings {
  static decodeRaw(data, x, y, w, h, fb, fbWidth) {
    let idx = 0;
    for (let row = 0; row < h; row++) {
      const dst = ((y + row) * fbWidth + x) * 4;
      for (let col = 0; col < w; col++) {
        fb[dst + col * 4] = data[idx];     // B
        fb[dst + col * 4 + 1] = data[idx + 1]; // G
        fb[dst + col * 4 + 2] = data[idx + 2]; // R
        fb[dst + col * 4 + 3] = 255;
        idx += 4;
      }
    }
  }

  static decodeCopyRect(data, x, y, fb, fbWidth, fbHeight) {
    const srcX = data.readUInt16BE(0);
    const srcY = data.readUInt16BE(2);
    // 逐行复制
    const w = x - srcX;
    const h = y - srcY;
    for (let row = 0; row < h; row++) {
      const src = ((srcY + row) * fbWidth + srcX) * 4;
      const dst = ((y + row) * fbWidth + x) * 4;
      for (let col = 0; col < w * 4; col++) {
        fb[dst + col] = fb[src + col];
      }
    }
  }

  static decodeRRE(data, x, y, w, h, fb, fbWidth) {
    let pos = 0;
    const numSubrects = data.readUInt32BE(pos); pos += 4;
    const bgB = data[pos++], bgG = data[pos++], bgR = data[pos++];
    // 填充背景
    for (let row = 0; row < h; row++) {
      const dst = ((y + row) * fbWidth + x) * 4;
      for (let col = 0; col < w; col++) {
        fb[dst + col * 4] = bgB;
        fb[dst + col * 4 + 1] = bgG;
        fb[dst + col * 4 + 2] = bgR;
        fb[dst + col * 4 + 3] = 255;
      }
    }
    for (let i = 0; i < numSubrects; i++) {
      const fgB = data[pos++], fgG = data[pos++], fgR = data[pos++];
      const sx = data[pos++], sy = data[pos++], sw = data[pos++], sh = data[pos++];
      for (let row = 0; row < sh; row++) {
        const dst = ((y + sy + row) * fbWidth + (x + sx)) * 4;
        for (let col = 0; col < sw; col++) {
          fb[dst + col * 4] = fgB;
          fb[dst + col * 4 + 1] = fgG;
          fb[dst + col * 4 + 2] = fgR;
          fb[dst + col * 4 + 3] = 255;
        }
      }
    }
  }

  static decodeHextile(data, x, y, w, h, fb, fbWidth) {
    let pos = 0;
    const tilesX = Math.ceil(w / 16);
    const tilesY = Math.ceil(h / 16);
    for (let ty = 0; ty < tilesY; ty++) {
      for (let tx = 0; tx < tilesX; tx++) {
        const subEnc = data[pos++];
        const tw = Math.min(16, w - tx * 16);
        const th = Math.min(16, h - ty * 16);
        const tx0 = x + tx * 16;
        const ty0 = y + ty * 16;

        if (subEnc & 1) {
          // Raw
          for (let row = 0; row < th; row++) {
            const dst = ((ty0 + row) * fbWidth + tx0) * 4;
            for (let col = 0; col < tw; col++) {
              fb[dst + col * 4] = data[pos++];
              fb[dst + col * 4 + 1] = data[pos++];
              fb[dst + col * 4 + 2] = data[pos++];
              fb[dst + col * 4 + 3] = 255;
            }
          }
          continue;
        }

        const bgB = (subEnc & 2) ? data[pos++] : null;
        const bgG = (subEnc & 2) ? data[pos++] : null;
        const bgR = (subEnc & 2) ? data[pos++] : null;

        // 使用保存的背景色或默认黑色
        let useBgB = 0, useBgG = 0, useBgR = 0;
        if (bgB !== null) { useBgB = bgB; useBgG = bgG; useBgR = bgR; }

        let fgB = 0, fgG = 0, fgR = 0;

        if (subEnc & 4) {
          // 前景色跟随
          fgB = data[pos++]; fgG = data[pos++]; fgR = data[pos++];
        }

        if (subEnc & 8) {
          // AnySubrects
          const numSubrects = data[pos++];
          // 先填充背景
          for (let row = 0; row < th; row++) {
            const dst = ((ty0 + row) * fbWidth + tx0) * 4;
            for (let col = 0; col < tw; col++) {
              fb[dst + col * 4] = useBgB;
              fb[dst + col * 4 + 1] = useBgG;
              fb[dst + col * 4 + 2] = useBgR;
              fb[dst + col * 4 + 3] = 255;
            }
          }
          for (let s = 0; s < numSubrects; s++) {
            if (subEnc & 16) {
              fgB = data[pos++]; fgG = data[pos++]; fgR = data[pos++];
            }
            const sr = data[pos++];
            const sx = (sr >> 4) & 0x0f;
            const sy = sr & 0x0f;
            const ss = data[pos++];
            const sw2 = (ss >> 4) & 0x0f;
            const sh2 = ss & 0x0f;
            for (let row = 0; row < sh2 + 1; row++) {
              const dst = ((ty0 + sy + row) * fbWidth + (tx0 + sx)) * 4;
              for (let col = 0; col < sw2 + 1; col++) {
                fb[dst + col * 4] = fgB;
                fb[dst + col * 4 + 1] = fgG;
                fb[dst + col * 4 + 2] = fgR;
                fb[dst + col * 4 + 3] = 255;
              }
            }
          }
        } else {
          // 纯色块
          for (let row = 0; row < th; row++) {
            const dst = ((ty0 + row) * fbWidth + tx0) * 4;
            for (let col = 0; col < tw; col++) {
              fb[dst + col * 4] = useBgB;
              fb[dst + col * 4 + 1] = useBgG;
              fb[dst + col * 4 + 2] = useBgR;
              fb[dst + col * 4 + 3] = 255;
            }
          }
        }
      }
    }
  }

  static decodeZRLE(data, x, y, w, h, fb, fbWidth) {
    try {
      const decompressed = pako.inflate(data);
      const reader = new Uint8Array(decompressed);
      let pos = 0;
      const tilesX = Math.ceil(w / 64);
      const tilesY = Math.ceil(h / 64);
      for (let ty = 0; ty < tilesY; ty++) {
        for (let tx = 0; tx < tilesX; tx++) {
          const tw = Math.min(64, w - tx * 64);
          const th = Math.min(64, h - ty * 64);
          const tx0 = x + tx * 64;
          const ty0 = y + ty * 64;
          const subEnc = reader[pos++];
          if (subEnc === 0) {
            // Raw
            for (let row = 0; row < th; row++) {
              const dst = ((ty0 + row) * fbWidth + tx0) * 4;
              for (let col = 0; col < tw; col++) {
                fb[dst + col * 4] = reader[pos++];
                fb[dst + col * 4 + 1] = reader[pos++];
                fb[dst + col * 4 + 2] = reader[pos++];
                fb[dst + col * 4 + 3] = 255;
              }
            }
          } else if (subEnc >= 1 && subEnc <= 3) {
            // Solid
            const r = reader[pos], g = reader[pos + 1], b = reader[pos + 2];
            pos += subEnc * 3;
            for (let row = 0; row < th; row++) {
              const dst = ((ty0 + row) * fbWidth + tx0) * 4;
              for (let col = 0; col < tw; col++) {
                fb[dst + col * 4] = b;
                fb[dst + col * 4 + 1] = g;
                fb[dst + col * 4 + 2] = r;
                fb[dst + col * 4 + 3] = 255;
              }
            }
          } else if (subEnc >= 4 && subEnc <= 6) {
            // Packed palette
            const paletteSize = subEnc === 4 ? 2 : (subEnc === 5 ? 4 : 16);
            const palette = [];
            for (let i = 0; i < paletteSize; i++) {
              palette.push({ r: reader[pos++], g: reader[pos++], b: reader[pos++] });
            }
            const bitsPerPixel = subEnc === 4 ? 1 : (subEnc === 5 ? 2 : 4);
            const pixelsPerByte = 8 / bitsPerPixel;
            const mask = (1 << bitsPerPixel) - 1;
            for (let row = 0; row < th; row++) {
              const dst = ((ty0 + row) * fbWidth + tx0) * 4;
              for (let col = 0; col < tw; col++) {
                const byteIdx = Math.floor(col / pixelsPerByte);
                const bitShift = (pixelsPerByte - 1 - (col % pixelsPerByte)) * bitsPerPixel;
                const idx = (reader[pos + byteIdx] >> bitShift) & mask;
                const c = palette[idx];
                fb[dst + col * 4] = c.b;
                fb[dst + col * 4 + 1] = c.g;
                fb[dst + col * 4 + 2] = c.r;
                fb[dst + col * 4 + 3] = 255;
              }
              pos += Math.ceil(tw / pixelsPerByte);
            }
          } else if (subEnc >= 7 && subEnc <= 9) {
            // Palette RLE
            const paletteSize = subEnc === 7 ? 2 : (subEnc === 8 ? 4 : 16);
            const palette = [];
            for (let i = 0; i < paletteSize; i++) {
              palette.push({ r: reader[pos + 2], g: reader[pos + 1], b: reader[pos] });
              pos += 3;
            }
            const bitsPerPixel = subEnc === 7 ? 1 : (subEnc === 8 ? 2 : 4);
            const pixelsPerByte = 8 / bitsPerPixel;
            const mask = (1 << bitsPerPixel) - 1;
            let remaining = tw * th;
            let row = 0, col = 0;
            while (remaining > 0) {
              const byte = reader[pos++];
              const isRle = byte & 0x80;
              const idx = (byte >> (8 - bitsPerPixel - 1)) & mask;
              let runLen = 1;
              if (isRle) {
                runLen = byte & 0x7f;
                if (runLen === 0) runLen = reader[pos++] + 1;
                else runLen += 1;
              }
              const c = palette[idx];
              for (let k = 0; k < runLen && remaining > 0; k++) {
                const dst = ((ty0 + row) * fbWidth + (tx0 + col)) * 4;
                fb[dst] = c.b;
                fb[dst + 1] = c.g;
                fb[dst + 2] = c.r;
                fb[dst + 3] = 255;
                col++;
                if (col >= tw) { col = 0; row++; }
                remaining--;
              }
            }
          } else if (subEnc === 16) {
            // Plain RLE
            pos--;
            let row = 0, col = 0;
            let remaining = tw * th;
            while (remaining > 0) {
              const r = reader[pos], g = reader[pos + 1], b = reader[pos + 2];
              pos += 3;
              let runLen = 1;
              if (pos < reader.length && reader[pos] === 0) {
                pos++;
                runLen = 1;
                let shift = 0;
                while (pos < reader.length) {
                  const byte = reader[pos++];
                  runLen |= (byte & 0x7f) << shift;
                  shift += 7;
                  if (!(byte & 0x80)) break;
                }
              }
              for (let k = 0; k < runLen && remaining > 0; k++) {
                const dst = ((ty0 + row) * fbWidth + (tx0 + col)) * 4;
                fb[dst] = b;
                fb[dst + 1] = g;
                fb[dst + 2] = r;
                fb[dst + 3] = 255;
                col++;
                if (col >= tw) { col = 0; row++; }
                remaining--;
              }
            }
          } else if (subEnc === 128) {
            // Skip (bg color)
            for (let row = 0; row < th; row++) {
              const dst = ((ty0 + row) * fbWidth + tx0) * 4;
              for (let col = 0; col < tw; col++) {
                fb[dst + col * 4] = 0;
                fb[dst + col * 4 + 1] = 0;
                fb[dst + col * 4 + 2] = 0;
                fb[dst + col * 4 + 3] = 255;
              }
            }
          }
        }
      }
    } catch (e) {
      console.error('ZRLE decode error:', e);
    }
  }

  // ---- Tight 编码解码 (TightVNC 协议) ----
  // 返回 { consumed: number, async: Promise|null }
  // JPEG 压缩需要异步解码（浏览器 Image 对象），非 JPEG 同步完成
  static decodeTight(data, x, y, w, h, fb, fbWidth) {
    let pos = 0;
    if (data.length < 1) return null;

    // 压缩控制字节: 高4位=压缩类型, 低4位=滤波器ID
    const compControl = data[pos++];
    const compType = (compControl >> 4) & 0x0F;
    const filterId = compControl & 0x0F;

    // 压缩类型 0x08 = JPEG
    if (compType === 0x08) {
      const readResult = TightReadVarLen(data, pos);
      if (!readResult) return null;
      pos = readResult.newPos;
      const jpegLen = readResult.value;
      if (data.length < pos + jpegLen) return null;
      const jpegData = data.subarray(pos, pos + jpegLen);
      const consumed = pos + jpegLen;
      // 返回异步 Promise - 浏览器原生 JPEG 解码
      const asyncPromise = TightDecodeJPEG(jpegData, x, y, w, h, fb, fbWidth);
      return { consumed, async: asyncPromise };
    }

    // 压缩类型 0x00 = Fill (单个 CPIXEL)
    if (compType === 0x00) {
      if (data.length < pos + 3) return null;
      const b = data[pos++];
      const g = data[pos++];
      const r = data[pos++];
      for (let row = 0; row < h; row++) {
        const dst = ((y + row) * fbWidth + x) * 4;
        for (let col = 0; col < w; col++) {
          const off = dst + col * 4;
          fb[off] = b;
          fb[off + 1] = g;
          fb[off + 2] = r;
          fb[off + 3] = 255;
        }
      }
      return { consumed: pos, async: null };
    }

    // 压缩类型 0x01 = Basic (zlib + 可选滤波器)
    const readResult = TightReadVarLen(data, pos);
    if (!readResult) return null;
    pos = readResult.newPos;
    const compressedLen = readResult.value;
    if (data.length < pos + compressedLen) return null;

    let rawData;
    try {
      rawData = pako.inflate(data.subarray(pos, pos + compressedLen));
    } catch (e) {
      console.error('Tight zlib inflate error:', e);
      return null;
    }

    const totalPixels = w * h;
    if (filterId === 0x00) {
      // Copy / 无滤波器 - 直接 RGB 像素
      let srcPos = 0;
      for (let i = 0; i < totalPixels; i++) {
        const dst = ((y + Math.floor(i / w)) * fbWidth + (x + (i % w))) * 4;
        fb[dst] = rawData[srcPos++];
        fb[dst + 1] = rawData[srcPos++];
        fb[dst + 2] = rawData[srcPos++];
        fb[dst + 3] = 255;
      }
    } else if (filterId === 0x01) {
      // Palette 滤波器
      const paletteSize = rawData[0] + 1;
      const palette = [];
      let srcPos = 1;
      for (let i = 0; i < paletteSize; i++) {
        palette.push({ b: rawData[srcPos++], g: rawData[srcPos++], r: rawData[srcPos++] });
      }
      if (paletteSize === 2) {
        // 每像素 1 bit
        for (let row = 0; row < h; row++) {
          for (let col = 0; col < w; col++) {
            const bitIdx = col;
            const byte = rawData[srcPos + Math.floor(row * Math.ceil(w / 8) + (bitIdx >> 3))];
            const shift = 7 - (bitIdx & 7);
            const idx = (byte >> shift) & 1;
            const c = palette[idx];
            const dst = ((y + row) * fbWidth + (x + col)) * 4;
            fb[dst] = c.b;
            fb[dst + 1] = c.g;
            fb[dst + 2] = c.r;
            fb[dst + 3] = 255;
          }
        }
      } else {
        // 3-256 色调色板: 每像素 1 byte
        for (let row = 0; row < h; row++) {
          for (let col = 0; col < w; col++) {
            const idx = rawData[srcPos + row * w + col];
            const c = palette[idx] || { b: 0, g: 0, r: 0 };
            const dst = ((y + row) * fbWidth + (x + col)) * 4;
            fb[dst] = c.b;
            fb[dst + 1] = c.g;
            fb[dst + 2] = c.r;
            fb[dst + 3] = 255;
          }
        }
      }
    } else if (filterId === 0x02) {
      // Gradient 滤波器 (JPEG-LS 风格)
      for (let row = 0; row < h; row++) {
        for (let col = 0; col < w; col++) {
          const rawOff = (row * w + col) * 3;
          const r = rawData[rawOff];
          const g = rawData[rawOff + 1];
          const b = rawData[rawOff + 2];

          let pr = 0, pg = 0, pb = 0;
          if (col > 0) {
            const off = ((y + row) * fbWidth + (x + col - 1)) * 4;
            pr = fb[off]; pg = fb[off + 1]; pb = fb[off + 2];
          }
          let ar = 0, ag = 0, ab = 0;
          if (row > 0) {
            const off = ((y + row - 1) * fbWidth + (x + col)) * 4;
            ar = fb[off]; ag = fb[off + 1]; ab = fb[off + 2];
          }

          const dr = (r + ((pr + ar) >> 1)) & 0xFF;
          const dg = (g + ((pg + ag) >> 1)) & 0xFF;
          const db = (b + ((pb + ab) >> 1)) & 0xFF;

          const dst = ((y + row) * fbWidth + (x + col)) * 4;
          fb[dst] = db;
          fb[dst + 1] = dg;
          fb[dst + 2] = dr;
          fb[dst + 3] = 255;
        }
      }
    } else {
      console.warn('Tight: 未知滤波器', filterId);
      return null;
    }

    return { consumed: pos + compressedLen, async: null };
  }
}

// Tight 变长整数读取 (1-3 字节)
function TightReadVarLen(data, startPos) {
  let pos = startPos;
  if (data.length < pos + 1) return null;
  let value = data[pos] & 0x7F;
  let bytesRead = 1;
  if (data[pos] & 0x80) {
    if (data.length < pos + 2) return null;
    value |= (data[pos + 1] & 0x7F) << 7;
    bytesRead = 2;
    if (data[pos + 1] & 0x80) {
      if (data.length < pos + 3) return null;
      value |= data[pos + 2] << 14;
      bytesRead = 3;
    }
  }
  return { value, newPos: pos + bytesRead };
}

// 浏览器原生 JPEG 解码（通过 Image + OffscreenCanvas）
// 返回 Promise，解码完成后将像素写入帧缓冲
function TightDecodeJPEG(jpegData, x, y, w, h, fb, fbWidth) {
  return new Promise((resolve) => {
    const blob = new Blob([jpegData], { type: 'image/jpeg' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      // 使用离屏 canvas 解码 JPEG 像素
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const imageData = ctx.getImageData(0, 0, w, h);
      const pixels = imageData.data;
      // 写入帧缓冲（RGBA -> BGRA 本地布局）
      for (let row = 0; row < h; row++) {
        for (let col = 0; col < w; col++) {
          const srcOff = (row * w + col) * 4;
          const dstOff = ((y + row) * fbWidth + (x + col)) * 4;
          fb[dstOff] = pixels[srcOff + 2];     // B
          fb[dstOff + 1] = pixels[srcOff + 1]; // G
          fb[dstOff + 2] = pixels[srcOff];     // R
          fb[dstOff + 3] = 255;
        }
      }
      URL.revokeObjectURL(url);
      resolve();
    };
    img.onerror = () => {
      console.warn('Tight JPEG 解码失败');
      URL.revokeObjectURL(url);
      resolve();
    };
    img.src = url;
  });
}

// ====== 移动端 RFB 客户端 ======
class MobileRfbClient {
  constructor() {
    this.ws = null;
    this.fbWidth = 0;
    this.fbHeight = 0;
    this.framebuffer = null;
    this.pixelFormat = { bpp: 32, depth: 24, bigEndian: false, trueColor: true, rMax: 255, gMax: 255, bMax: 255, rShift: 16, gShift: 8, bShift: 0 };
    this.name = '';
    this.shared = true;
    this.buffer = new Uint8Array(0);
    this.connected = false;
    this.onUpdate = null;
    this.onError = null;
    this.onClose = null;
    this.onName = null;
    this.onResize = null;
    this.supportsHextile = true;
    this.supportsZRLE = true;
    this.supportsCopyRect = true;
    this.supportsRRE = true;
    this.supportsCursor = false;
  }

  connect(host, port, password) {
    log('info', '正在连接代理服务器 ws://' + host + ':' + port + '/proxy');
    const wsUrl = `ws://${host}:${port}/proxy`;
    this.ws = new WebSocket(wsUrl);
    this.ws.binaryType = 'arraybuffer';

    this.ws.onopen = () => {
      log('info', 'WebSocket 已连接，发送 VNC 连接命令');
      // 发送连接命令: 0x00 + host + 0x00 + port
      const hostBytes = new TextEncoder().encode(host);
      const buf = new Uint8Array(1 + hostBytes.length + 1 + 2);
      buf[0] = 0x00;
      buf.set(hostBytes, 1);
      buf[1 + hostBytes.length] = 0x00;
      buf.writeUInt16BE = function(v, o) { this[o] = v >> 8; this[o+1] = v & 0xff; };
      buf.writeUInt16BE(port, 1 + hostBytes.length + 1);
      this.ws.send(buf);
    };

    this.ws.onmessage = (event) => {
      const data = new Uint8Array(event.data);
      if (data.length === 1 && data[0] === 0x01) {
        log('info', '代理已连接到 VNC 服务器，开始 RFB 握手');
        // Connected signal - 开始 RFB 握手
        this._startHandshake(password);
        return;
      }
      if (data[0] === 0x02) {
        // Error signal
        const len = data[1];
        const msg = new TextDecoder().decode(data.slice(2, 2 + len));
        log('error', '代理错误: ' + msg);
        if (this.onError) this.onError(msg);
        return;
      }
      if (data[0] === 0x03) {
        log('warn', 'VNC 连接已关闭');
        // Closed signal
        if (this.onClose) this.onClose();
        return;
      }
      // RFB 协议数据
      this._appendData(data);
      this._processData();
    };

    this.ws.onerror = () => {
      log('error', 'WebSocket 连接失败');
      if (this.onError) this.onError('连接失败');
    };

    this.ws.onclose = () => {
      if (this.connected && this.onClose) this.onClose();
      this.connected = false;
    };
  }

  _appendData(data) {
    const newBuf = new Uint8Array(this.buffer.length + data.length);
    newBuf.set(this.buffer);
    newBuf.set(data, this.buffer.length);
    this.buffer = newBuf;
  }

  _consume(n) {
    if (n >= this.buffer.length) {
      this.buffer = new Uint8Array(0);
      return;
    }
    this.buffer = this.buffer.slice(n);
  }

  _send(data) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(data);
    }
  }

  _startHandshake(password) {
    log('info', '开始 RFB 协议握手');
    this._sendRfbMessage = this._send.bind(this);
    this._expect(12, (data) => {
      const verStr = new TextDecoder().decode(data.slice(0, 12));
      let major = 3, minor = 8;
      const m = verStr.match(/RFB (\d+)\.(\d+)/);
      if (m) { major = parseInt(m[1]); minor = parseInt(m[2]); }
      this.versionMajor = major;
      this.versionMinor = minor;
      log('info', '服务器版本: RFB ' + major + '.' + minor);

      if (major === 3 && minor >= 8) {
        this._send(new TextEncoder().encode('RFB 003.008\n'));
        this._doSecurityType(password);
      } else if (major === 3 && minor >= 7) {
        this._send(new TextEncoder().encode('RFB 003.007\n'));
        this._doSecurityType(password);
      } else {
        this._send(new TextEncoder().encode('RFB 003.003\n'));
        this._doVncAuth(password);
      }
    });
  }

  _doSecurityType(password) {
    this._expect(1, (data) => {
      const numTypes = data[0];
      if (numTypes === 0) {
        this._expect(4, (err) => {
          const reason = new TextDecoder().decode(err);
          log('error', '服务器拒绝连接: ' + reason);
          if (this.onError) this.onError('认证失败: ' + reason);
        });
        return;
      }
      this._expect(numTypes, (types) => {
        log('info', '支持的安全类型: ' + Array.from(types).join(', '));
        // Prefer 2 (VNC Auth), then 1 (None)
        let chosen = 0;
        for (let i = 0; i < numTypes; i++) {
          if (types[i] === 2 && password) { chosen = 2; break; }
          if (types[i] === 1) { chosen = 1; }
        }
        log('info', '选择安全类型: ' + (chosen === 1 ? 'None' : chosen === 2 ? 'VNC Auth' : chosen));
        this._send(new Uint8Array([chosen]));
        if (chosen === 1) {
          if (this.versionMinor >= 8) {
            this._expect(4, () => { this._sendClientInit(password); });
          } else {
            this._sendClientInit(password);
          }
        } else if (chosen === 2) {
          this._doVncAuth(password);
        } else {
          log('error', '不支持的安全类型');
          if (this.onError) this.onError('不支持的安全类型');
        }
      });
    });
  }

  _doVncAuth(password) {
    log('info', 'VNC 认证中...');
    this._expect(16, (challenge) => {
      log('info', '收到 16 字节挑战码');
      const response = vncAuth(password, challenge);
      this._send(response);
      this._expect(4, (result) => {
        const status = (result[3] << 24) | (result[2] << 16) | (result[1] << 8) | result[0];
        if (status === 0) {
          log('info', 'VNC 认证成功');
          this._sendClientInit(password);
        } else {
          const reason = status === 1 ? '密码错误' : '认证失败 (错误码: ' + status + ')';
          log('error', reason);
          if (this.onError) this.onError(reason);
        }
      });
    });
  }

  _sendClientInit(password) {
    log('info', '发送 ClientInit (shared=' + (this.shared ? 1 : 0) + ')');
    // 共享标志
    this._send(new Uint8Array([this.shared ? 1 : 0]));
    this._receiveServerInit(password);
  }

  _receiveServerInit(password) {
    log('info', '等待 ServerInit...');
    this._expect(1, (data) => {
      this.fbWidth = data[0] << 8;
      this._expect(1, (data2) => {
        this.fbWidth |= data2[0];
        this._expect(1, (data3) => {
          this.fbHeight = data3[0] << 8;
          this._expect(1, (data4) => {
            this.fbHeight |= data4[0];
            log('info', '桌面尺寸: ' + this.fbWidth + 'x' + this.fbHeight);
            // Pixel format (16 bytes) + name length (4 bytes) + name
            this._expect(16, (pixFmt) => {
              // Parse pixel format
              this._expect(4, (nameLenData) => {
                const nameLen = (nameLenData[0] << 24) | (nameLenData[1] << 16) | (nameLenData[2] << 8) | nameLenData[3];
                this._expect(nameLen, (nameData) => {
                  this.name = new TextDecoder().decode(nameData);
                  this.connected = true;
                  log('info', '桌面名称: ' + this.name);
                  if (this.onName) this.onName(this.name);
                  if (this.onResize) this.onResize(this.fbWidth, this.fbHeight);
                  this.framebuffer = new Uint8Array(this.fbWidth * this.fbHeight * 4);
                  this._setPixelFormat();
                  this._setEncodings();
                  this._requestUpdate(true);
                  this._readLoop();
                });
              });
            });
          });
        });
      });
    });
  }

  _setPixelFormat() {
    const msg = new Uint8Array(20);
    msg[0] = 0; // SetPixelFormat
    msg[1] = 0; // padding
    msg[2] = 0; msg[3] = 0; // padding
    msg[4] = this.pixelFormat.bpp;
    msg[5] = this.pixelFormat.depth;
    msg[6] = this.pixelFormat.bigEndian ? 1 : 0;
    msg[7] = this.pixelFormat.trueColor ? 1 : 0;
    msg[8] = this.pixelFormat.rMax >> 8;
    msg[9] = this.pixelFormat.rMax & 0xff;
    msg[10] = this.pixelFormat.gMax >> 8;
    msg[11] = this.pixelFormat.gMax & 0xff;
    msg[12] = this.pixelFormat.bMax >> 8;
    msg[13] = this.pixelFormat.bMax & 0xff;
    msg[14] = this.pixelFormat.rShift;
    msg[15] = this.pixelFormat.gShift;
    msg[16] = this.pixelFormat.bShift;
    msg[17] = 0; msg[18] = 0; msg[19] = 0; // padding
    this._send(msg);
  }

  _setEncodings() {
    const encodings = [
      -16,  // ZRLE
      7,    // Tight (含 JPEG - 高压缩比优先)
      -255, // DesktopSize
      -223, // DesktopName
      -24,  // LastRect
      -5,   // Hextile
      -2,   // RRE
      -239, // Cursor
      -1,   // CopyRect
      0,    // Raw
    ];
    const msg = new Uint8Array(2 + encodings.length * 4);
    msg[0] = 2; // SetEncodings
    msg[1] = 0;
    msg.writeUInt16BE = function(v, o) { this[o] = v >> 8; this[o+1] = v & 0xff; };
    msg.writeUInt16BE(encodings.length, 2);
    for (let i = 0; i < encodings.length; i++) {
      msg.writeInt32BE = function(v, o) { this[o] = v >> 24 & 0xff; this[o+1] = v >> 16 & 0xff; this[o+2] = v >> 8 & 0xff; this[o+3] = v & 0xff; };
      msg.writeInt32BE(encodings[i], 4 + i * 4);
    }
    this._send(msg);
  }

  _requestUpdate(incremental) {
    const msg = new Uint8Array(10);
    msg[0] = 3; // FramebufferUpdateRequest
    msg[1] = incremental ? 1 : 0;
    msg.writeUInt16BE = function(v, o) { this[o] = v >> 8; this[o+1] = v & 0xff; };
    msg.writeUInt16BE(0, 2); // x
    msg.writeUInt16BE(0, 4); // y
    msg.writeUInt16BE(this.fbWidth, 6);
    msg.writeUInt16BE(this.fbHeight, 8);
    this._send(msg);
  }

  _readLoop() {
    this._processData();
  }

  _expect(n, callback) {
    if (this.buffer.length >= n) {
      const data = this.buffer.slice(0, n);
      this._consume(n);
      callback(data);
      return true;
    }
    this._pendingExpect = { n, callback };
    return false;
  }

  async _processData() {
    while (this.buffer.length > 0) {
      // 先处理挂起的握手/数据读取，握手完成前也能消费数据
      if (this._pendingExpect) {
        const { n, callback } = this._pendingExpect;
        if (this.buffer.length >= n) {
          this._pendingExpect = null;
          const data = this.buffer.slice(0, n);
          this._consume(n);
          callback(data);
          continue;
        }
        break;
      }

      // 握手完成前不处理 FramebufferUpdate，等待更多数据
      if (!this.connected) break;

      // 等待 FramebufferUpdate 消息
      if (this.buffer.length < 4) break;
      const msgType = this.buffer[0];
      if (msgType === 0) {
        // FramebufferUpdate (async)
        await this._processFramebufferUpdate();
        // _processFramebufferUpdate 已经通过 setTimeout 调度后续处理
        return;
      } else {
        // 未知消息类型，忽略
        this._consume(1);
      }
    }
  }

  // async-aware 帧处理：收集所有矩形，等待异步的 Tight JPEG 完成，再统一发出 frame update
  async _processFramebufferUpdate() {
    if (this.buffer.length < 4) return;
    const padding = this.buffer[1];
    const numRects = (this.buffer[2] << 8) | this.buffer[3];
    let pos = 4;
    let rectsProcessed = 0;
    const asyncOps = [];

    const tryProcess = () => {
      while (rectsProcessed < numRects) {
        if (this.buffer.length < pos + 12) return false;
        const rx = (this.buffer[pos] << 8) | this.buffer[pos + 1];
        const ry = (this.buffer[pos + 2] << 8) | this.buffer[pos + 3];
        const rw = (this.buffer[pos + 4] << 8) | this.buffer[pos + 5];
        const rh = (this.buffer[pos + 6] << 8) | this.buffer[pos + 7];
        // encoding type is signed 32-bit
        const enc = (this.buffer[pos + 8] << 24) | (this.buffer[pos + 9] << 16) | (this.buffer[pos + 10] << 8) | this.buffer[pos + 11];

        pos += 12;

        if (enc === 0xFFFFFF20) {
          // LastRect
          rectsProcessed++;
          continue;
        }

        if (enc === 0xFFFFFF21) {
          // DesktopSize (NewFBSize)
          this.fbWidth = rw;
          this.fbHeight = rh;
          this.framebuffer = new Uint8Array(this.fbWidth * this.fbHeight * 4);
          if (this.onResize) this.onResize(this.fbWidth, this.fbHeight);
          rectsProcessed++;
          continue;
        }

        if (enc === 0xFFFFFF22) {
          // DesktopName
          if (this.buffer.length < pos + 4) return false;
          const nameLen = (this.buffer[pos] << 24) | (this.buffer[pos + 1] << 16) | (this.buffer[pos + 2] << 8) | this.buffer[pos + 3];
          pos += 4;
          if (this.buffer.length < pos + nameLen) return false;
          this.name = new TextDecoder().decode(this.buffer.slice(pos, pos + nameLen));
          pos += nameLen;
          if (this.onName) this.onName(this.name);
          rectsProcessed++;
          continue;
        }

        if (enc === 0xFFFFFF10) {
          // Cursor (含 AND/XOR mask)
          const pixelsLen = rw * rh * 4;
          const maskLen = Math.ceil(rw / 8) * rh;
          const cursorLen = pixelsLen + maskLen;
          if (this.buffer.length < pos + cursorLen) return false;
          // x, y 是热点位置 (hotspot)
          const pixelData = this.buffer.slice(pos, pos + pixelsLen);
          const maskData = this.buffer.slice(pos + pixelsLen, pos + pixelsLen + maskLen);
          if (typeof decodeRemoteCursor === 'function') {
            decodeRemoteCursor(rx, ry, rw, rh, pixelData, maskData);
          }
          pos += cursorLen;
          rectsProcessed++;
          continue;
        }

        if (enc === 0xFFFFFF11) {
          // RichCursor (含 alpha 通道)
          const pixelsLen = rw * rh * 4;
          const maskLen = Math.ceil(rw / 8) * rh;
          const cursorLen = pixelsLen + maskLen;
          if (this.buffer.length < pos + cursorLen) return false;
          const pixelData = this.buffer.slice(pos, pos + pixelsLen);
          const maskData = null; // RichCursor 自带 alpha，不需要额外 mask
          if (typeof decodeRemoteCursor === 'function') {
            decodeRemoteCursor(rx, ry, rw, rh, pixelData, maskData);
          }
          pos += cursorLen;
          rectsProcessed++;
          continue;
        }

        if (enc === 0) {
          // Raw
          const bytesNeeded = rw * rh * 4;
          if (this.buffer.length < pos + bytesNeeded) return false;
          Encodings.decodeRaw(this.buffer.slice(pos, pos + bytesNeeded), rx, ry, rw, rh, this.framebuffer, this.fbWidth);
          pos += bytesNeeded;
        } else if (enc === -1 || enc === 0xFFFFFFFF) {
          // CopyRect
          if (this.buffer.length < pos + 4) return false;
          // 使用正确的参数: rect 的宽高 rw, rh 而不是坐标差
          Encodings.decodeCopyRect(this.buffer.slice(pos, pos + 4), rx, ry, rw, rh, this.framebuffer, this.fbWidth);
          pos += 4;
        } else if (enc === -2 || enc === 0xFFFFFFFE) {
          // RRE
          if (this.buffer.length < pos + 4) return false;
          const numSub = (this.buffer[pos] << 24) | (this.buffer[pos + 1] << 16) | (this.buffer[pos + 2] << 8) | this.buffer[pos + 3];
          const rreBytes = 4 + 3 + numSub * (3 + 4);
          if (this.buffer.length < pos + rreBytes) return false;
          Encodings.decodeRRE(this.buffer.slice(pos, pos + rreBytes), rx, ry, rw, rh, this.framebuffer, this.fbWidth);
          pos += rreBytes;
        } else if (enc === -5 || enc === 0xFFFFFFFB) {
          // Hextile
          try {
            const decoded = this._decodeHextilePartial(this.buffer, pos, rx, ry, rw, rh);
            if (decoded === null) return false;
            pos = decoded;
          } catch (e) {
            return false;
          }
        } else if (enc === -16 || enc === 0xFFFFFFEF) {
          // ZRLE
          if (this.buffer.length < pos + 4) return false;
          const zrleLen = (this.buffer[pos] << 24) | (this.buffer[pos + 1] << 16) | (this.buffer[pos + 2] << 8) | this.buffer[pos + 3];
          pos += 4;
          if (this.buffer.length < pos + zrleLen) return false;
          Encodings.decodeZRLE(this.buffer.slice(pos, pos + zrleLen), rx, ry, rw, rh, this.framebuffer, this.fbWidth);
          pos += zrleLen;
        } else if (enc === 7) {
          // Tight (含 JPEG / zlib / fill)
          const dataSlice = this.buffer.slice(pos);
          const result = Encodings.decodeTight(dataSlice, rx, ry, rw, rh, this.framebuffer, this.fbWidth);
          if (result === null) return false;
          pos += result.consumed;
          if (result.async) {
            asyncOps.push(result.async);
          }
        } else {
          // Unknown encoding - cannot safely skip (unknown size)
          console.warn('未知编码:', enc, '(0x' + (enc >>> 0).toString(16) + ')');
          return false;
        }

        rectsProcessed++;
      }
      return true;
    };

    if (tryProcess()) {
      // 等待所有异步操作（Tight JPEG 解码）完成
      if (asyncOps.length > 0) {
        await Promise.all(asyncOps);
      }
      this._consume(pos);
      if (this.onUpdate) this.onUpdate(this.framebuffer, this.fbWidth, this.fbHeight);
      this._pendingExpect = null;
      // 请求增量更新
      this._requestUpdate(true);
      // 使用 setTimeout 让出事件循环，避免堆栈过深
      setTimeout(() => this._processData(), 0);
    }
  }

  _decodeHextilePartial(buf, startPos, rx, ry, rw, rh) {
    let pos = startPos;
    const tilesX = Math.ceil(rw / 16);
    const tilesY = Math.ceil(rh / 16);
    for (let ty = 0; ty < tilesY; ty++) {
      for (let tx = 0; tx < tilesX; tx++) {
        if (buf.length < pos + 1) return null;
        const subEnc = buf[pos++];
        const tw = Math.min(16, rw - tx * 16);
        const th = Math.min(16, rh - ty * 16);
        const tx0 = rx + tx * 16;
        const ty0 = ry + ty * 16;

        if (subEnc & 1) {
          // Raw
          const needed = tw * th * 3;
          if (buf.length < pos + needed) return null;
          for (let row = 0; row < th; row++) {
            const dst = ((ty0 + row) * this.fbWidth + tx0) * 4;
            for (let col = 0; col < tw; col++) {
              this.framebuffer[dst + col * 4] = buf[pos++];
              this.framebuffer[dst + col * 4 + 1] = buf[pos++];
              this.framebuffer[dst + col * 4 + 2] = buf[pos++];
              this.framebuffer[dst + col * 4 + 3] = 255;
            }
          }
          continue;
        }

        let bgB = 0, bgG = 0, bgR = 0;
        if (subEnc & 2) {
          if (buf.length < pos + 3) return null;
          bgB = buf[pos++]; bgG = buf[pos++]; bgR = buf[pos++];
        }

        let fgB = 0, fgG = 0, fgR = 0;
        if (subEnc & 4) {
          if (buf.length < pos + 3) return null;
          fgB = buf[pos++]; fgG = buf[pos++]; fgR = buf[pos++];
        }

        if (subEnc & 8) {
          // AnySubrects
          if (buf.length < pos + 1) return null;
          const numSubrects = buf[pos++];
          for (let row = 0; row < th; row++) {
            const dst = ((ty0 + row) * this.fbWidth + tx0) * 4;
            for (let col = 0; col < tw; col++) {
              this.framebuffer[dst + col * 4] = bgB;
              this.framebuffer[dst + col * 4 + 1] = bgG;
              this.framebuffer[dst + col * 4 + 2] = bgR;
              this.framebuffer[dst + col * 4 + 3] = 255;
            }
          }
          for (let s = 0; s < numSubrects; s++) {
            if (subEnc & 16) {
              if (buf.length < pos + 3) return null;
              fgB = buf[pos++]; fgG = buf[pos++]; fgR = buf[pos++];
            }
            if (buf.length < pos + 2) return null;
            const sr = buf[pos++];
            const sx = (sr >> 4) & 0x0f;
            const sy = sr & 0x0f;
            const ss = buf[pos++];
            const sw2 = (ss >> 4) & 0x0f;
            const sh2 = ss & 0x0f;
            for (let row = 0; row < sh2 + 1; row++) {
              const dst = ((ty0 + sy + row) * this.fbWidth + (tx0 + sx)) * 4;
              for (let col = 0; col < sw2 + 1; col++) {
                this.framebuffer[dst + col * 4] = fgB;
                this.framebuffer[dst + col * 4 + 1] = fgG;
                this.framebuffer[dst + col * 4 + 2] = fgR;
                this.framebuffer[dst + col * 4 + 3] = 255;
              }
            }
          }
        } else {
          // Solid background
          for (let row = 0; row < th; row++) {
            const dst = ((ty0 + row) * this.fbWidth + tx0) * 4;
            for (let col = 0; col < tw; col++) {
              this.framebuffer[dst + col * 4] = bgB;
              this.framebuffer[dst + col * 4 + 1] = bgG;
              this.framebuffer[dst + col * 4 + 2] = bgR;
              this.framebuffer[dst + col * 4 + 3] = 255;
            }
          }
        }
      }
    }
    return pos;
  }

  sendPointerEvent(x, y, buttonMask) {
    const msg = new Uint8Array(6);
    msg[0] = 5; // PointerEvent
    msg[1] = buttonMask;
    msg.writeUInt16BE = function(v, o) { this[o] = v >> 8; this[o+1] = v & 0xff; };
    msg.writeUInt16BE(x, 2);
    msg.writeUInt16BE(y, 4);
    this._send(msg);
  }

  sendKeyEvent(keysym, down) {
    const msg = new Uint8Array(8);
    msg[0] = 4; // KeyEvent
    msg[1] = down ? 1 : 0;
    msg[2] = 0; msg[3] = 0; // padding
    msg.writeUInt32BE = function(v, o) { this[o] = v >> 24 & 0xff; this[o+1] = v >> 16 & 0xff; this[o+2] = v >> 8 & 0xff; this[o+3] = v & 0xff; };
    msg.writeUInt32BE(keysym, 4);
    this._send(msg);
  }

  disconnect() {
    if (this.ws) {
      this.ws.close();
      this.ws = null;
    }
    this.connected = false;
  }
}

// ====== UI 控制器 ======
const canvas = document.getElementById('vnc-canvas');
const ctx = canvas.getContext('2d');
cursorCanvas = document.getElementById('cursor-canvas');
cursorCtx = cursorCanvas ? cursorCanvas.getContext('2d') : null;
const connectPanel = document.getElementById('connect-panel');
const toolbar = document.getElementById('toolbar');
const keyboardPanel = document.getElementById('keyboard-panel');
const zoomIndicator = document.getElementById('zoom-indicator');
const statusText = document.getElementById('status-text');
const toolbarTitle = document.getElementById('toolbar-title');

let client = null;
let scale = 1;
let offsetX = 0, offsetY = 0;
let fbW = 0, fbH = 0;
let isDragging = false, isPanning = false;
let lastTouchDist = 0;
let lastTouchX = 0, lastTouchY = 0;
let activeModifiers = {};
let keyboardVisible = false;
let zoomMode = 'fit'; // 'fit' or 'actual'

// 远程光标状态
let cursorCanvas, cursorCtx;
let remoteCursor = null; // { x, y, hotX, hotY, w, h, pixels, visible }
let lastCursorX = 0, lastCursorY = 0;
let cursorVisible = false;

// 获取连接参数
function getConnectionParams() {
  const host = document.getElementById('input-host').value.trim();
  let port = parseInt(document.getElementById('input-port').value) || 5900;
  const display = parseInt(document.getElementById('input-display').value) || 0;
  const password = document.getElementById('input-password').value;
  if (!host) { statusText.textContent = '请输入服务器地址'; statusText.className = 'error'; return null; }
  if (display > 0) port += display;
  return { host, port, password };
}

// 获取代理服务器地址
function getProxyServer() {
  // 从页面 URL 推断代理地址
  const loc = window.location;
  return { host: loc.hostname, port: loc.port || 5933 };
}

// 连接
function doConnect() {
  const params = getConnectionParams();
  if (!params) return;

  const btn = document.getElementById('btn-connect');
  btn.disabled = true;
  statusText.textContent = '连接中...';
  statusText.className = '';
  log('info', '准备连接 VNC: ' + params.host + ':' + params.port + (params.password ? ' (有密码)' : ' (无密码)'));

  const proxy = getProxyServer();
  log('info', '代理服务器: ' + proxy.host + ':' + proxy.port);

  // 关闭旧连接，避免重复创建导致的问题
  if (client) {
    client.disconnect();
    client = null;
  }

  const c = new MobileRfbClient();

  c.onName = (name) => {
    toolbarTitle.textContent = `${params.host} - ${name}`;
    connectPanel.classList.add('hidden');
    toolbar.classList.remove('hidden');
    statusText.textContent = '已连接';
    statusText.className = 'connected';
    btn.disabled = false;
  };

  c.onResize = (w, h) => {
    fbW = w;
    fbH = h;
    resizeCanvas();
  };

  c.onUpdate = (fb, w, h) => {
    try {
      const imageData = new ImageData(new Uint8ClampedArray(fb.buffer), w, h);
      ctx.putImageData(imageData, 0, 0);
    } catch (e) {
      console.error('渲染画面失败:', e);
    }
  };

  c.onError = (msg) => {
    log('error', '连接错误: ' + msg);
    statusText.textContent = '错误: ' + msg;
    statusText.className = 'error';
    btn.disabled = false;
    if (client === c) client = null;
  };

  c.onClose = () => {
    log('warn', '连接已断开');
    statusText.textContent = '已断开连接';
    statusText.className = '';
    connectPanel.classList.remove('hidden');
    toolbar.classList.add('hidden');
    keyboardPanel.classList.add('hidden');
    keyboardVisible = false;
    btn.disabled = false;
    if (client === c) client = null;
  };

  // 连接的 WebSocket 是代理服务器，VNC 目标地址在握手命令中发送
  const wsUrl = `ws://${proxy.host}:${proxy.port}/proxy`;
  const ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  // 让客户端通过该 WebSocket 发送 RFB 数据
  c.ws = ws;
  c._sendRfbMessage = (d) => {
    if (ws.readyState === WebSocket.OPEN) ws.send(d);
  };

  ws.onopen = () => {
    log('info', 'WebSocket 已连接，发送 VNC 连接命令');
    // 发送连接命令: 0x00 + VNC host + 0x00 + port
    const hostBytes = new TextEncoder().encode(params.host);
    const buf = new Uint8Array(1 + hostBytes.length + 2 + 2);
    buf[0] = 0x00;
    buf.set(hostBytes, 1);
    buf[1 + hostBytes.length] = 0x00;
    buf[1 + hostBytes.length + 1] = (params.port >> 8) & 0xff;
    buf[1 + hostBytes.length + 2] = params.port & 0xff;
    ws.send(buf);
  };

  ws.onmessage = (event) => {
    // 连接可能已断开（client 被置空），直接忽略
    if (!c) return;
    const data = new Uint8Array(event.data);
    if (data.length === 1 && data[0] === 0x01) {
      log('info', '代理已连上 VNC 服务器，开始 RFB 握手');
      // 代理已连上 VNC，开始 RFB 握手
      c._startHandshake(params.password);
      return;
    }
    if (data[0] === 0x02) {
      // 代理返回错误（如 VNC 地址不可达）
      const len = data[1];
      const msg = new TextDecoder().decode(data.slice(2, 2 + len));
      log('error', '代理错误: ' + msg);
      statusText.textContent = '错误: ' + msg;
      statusText.className = 'error';
      btn.disabled = false;
      if (client === c) client = null;
      return;
    }
    if (data[0] === 0x03) {
      log('warn', 'VNC 连接已关闭');
      statusText.textContent = '已断开连接';
      statusText.className = '';
      connectPanel.classList.remove('hidden');
      toolbar.classList.add('hidden');
      keyboardPanel.classList.add('hidden');
      keyboardVisible = false;
      btn.disabled = false;
      if (client === c) client = null;
      return;
    }
    // RFB 协议数据
    c._appendData(data);
    c._processData();
  };

  ws.onerror = () => {
    log('error', '无法连接到代理服务器 ' + proxy.host + ':' + proxy.port);
    statusText.textContent = '无法连接到代理服务器';
    statusText.className = 'error';
    btn.disabled = false;
    if (client === c) client = null;
  };

  ws.onclose = () => {
    if (client === c && c.connected) {
      log('warn', 'WebSocket 连接已关闭');
      statusText.textContent = '连接已断开';
      connectPanel.classList.remove('hidden');
      toolbar.classList.add('hidden');
      keyboardPanel.classList.add('hidden');
      keyboardVisible = false;
      btn.disabled = false;
      if (client === c) client = null;
    }
  };

  client = c;
}

// 断开连接
function disconnect() {
  log('warn', '用户主动断开连接');
  if (client) {
    client.disconnect();
    client = null;
  }
  connectPanel.classList.remove('hidden');
  toolbar.classList.add('hidden');
  keyboardPanel.classList.add('hidden');
  keyboardVisible = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  statusText.textContent = '已断开';
  statusText.className = '';
}

// 调整画布大小
function resizeCanvas() {
  const wrapper = document.getElementById('canvas-wrapper');
  const wrapperW = wrapper.clientWidth;
  const wrapperH = wrapper.clientHeight;

  if (zoomMode === 'fit') {
    const scaleX = wrapperW / fbW;
    const scaleY = wrapperH / fbH;
    scale = Math.min(scaleX, scaleY, 1);
  } else {
    scale = 1;
  }

  canvas.width = fbW;
  canvas.height = fbH;
  canvas.style.width = (fbW * scale) + 'px';
  canvas.style.height = (fbH * scale) + 'px';

  // 居中
  offsetX = (wrapperW - fbW * scale) / 2;
  offsetY = (wrapperH - fbH * scale) / 2;
  canvas.style.marginLeft = offsetX + 'px';
  canvas.style.marginTop = offsetY + 'px';

  updateZoomIndicator();
}

// 切换缩放模式
function toggleZoom() {
  zoomMode = zoomMode === 'fit' ? 'actual' : 'fit';
  if (fbW > 0) resizeCanvas();
  updateZoomIndicator();
}

// 更新缩放指示器
function updateZoomIndicator() {
  zoomIndicator.textContent = zoomMode === 'fit' ? '缩放适应' : Math.round(scale * 100) + '%';
  zoomIndicator.classList.add('show');
  clearTimeout(zoomIndicator._hideTimer);
  zoomIndicator._hideTimer = setTimeout(() => {
    zoomIndicator.classList.remove('show');
  }, 1500);
}

// ===== 远程光标支持 =====
// 解码 / 更新远程光标（Cursor 或 RichCursor 伪编码）
// rx, ry 是热点位置（hotspot）
function decodeRemoteCursor(rx, ry, rw, rh, pixelData, maskData) {
  if (!cursorCtx || rw <= 0 || rh <= 0 || rw > 128 || rh > 128) return;
  const totalPx = rw * rh;
  const pixels = new Uint8ClampedArray(totalPx * 4);
  for (let i = 0; i < totalPx; i++) {
    // pixelData 格式: BGRA (与 VNC 像素格式匹配)
    const src = i * 4;
    pixels[i * 4] = pixelData[src + 2];     // R
    pixels[i * 4 + 1] = pixelData[src + 1]; // G
    pixels[i * 4 + 2] = pixelData[src];     // B
    pixels[i * 4 + 3] = 255;               // A
  }
  remoteCursor = {
    x: rx, y: ry, hotX: rx, hotY: ry,
    w: rw, h: rh, pixels, mask: maskData, visible: true
  };
  drawRemoteCursor();
}

// 绘制远程光标到独立 canvas
function drawRemoteCursor() {
  if (!remoteCursor || !remoteCursor.visible || !cursorCtx) return;
  const cw = remoteCursor.w, ch = remoteCursor.h;
  cursorCanvas.width = cw;
  cursorCanvas.height = ch;
  const imgData = cursorCtx.createImageData(cw, ch);
  const pixels = remoteCursor.pixels;
  const mask = remoteCursor.mask;
  for (let i = 0; i < cw * ch; i++) {
    // mask: 1=可见, 0=透明 (Cursor 使用 AND mask; RichCursor 自带 alpha)
    let alpha = 255;
    if (mask && mask.length > 0) {
      const byteIdx = Math.floor(i / 8);
      const bitIdx = 7 - (i % 8);
      if (byteIdx < mask.length) {
        alpha = (mask[byteIdx] >> bitIdx) & 1 ? 255 : 0;
      }
    }
    imgData.data[i * 4] = pixels[i * 4];
    imgData.data[i * 4 + 1] = pixels[i * 4 + 1];
    imgData.data[i * 4 + 2] = pixels[i * 4 + 2];
    imgData.data[i * 4 + 3] = alpha;
  }
  cursorCtx.putImageData(imgData, 0, 0);
  cursorCanvas.classList.remove('hidden');
  // 定位光标（以热点为中心）
  positionRemoteCursor();
}

function positionRemoteCursor() {
  if (!remoteCursor) return;
  const fx = (remoteCursor.x - remoteCursor.hotX) * scale + offsetX;
  const fy = (remoteCursor.y - remoteCursor.hotY) * scale + offsetY;
  cursorCanvas.style.left = fx + 'px';
  cursorCanvas.style.top = fy + 'px';
  cursorCanvas.style.width = (remoteCursor.w * scale) + 'px';
  cursorCanvas.style.height = (remoteCursor.h * scale) + 'px';
}

// 隐藏远程光标
function hideRemoteCursor() {
  if (cursorCanvas) cursorCanvas.classList.add('hidden');
  if (remoteCursor) remoteCursor.visible = false;
}

// 切换键盘
function toggleKeyboard() {
  keyboardVisible = !keyboardVisible;
  keyboardPanel.classList.toggle('hidden', !keyboardVisible);
}

// ====== 触摸事件处理 (增强: 平滑缩放 / 中心点锚定 / 平移跟随) ======
let lastPinchCenterX = 0, lastPinchCenterY = 0;
let lastPanX = 0, lastPanY = 0;

function applyCanvasTransform() {
  canvas.style.width = (fbW * scale) + 'px';
  canvas.style.height = (fbH * scale) + 'px';
  canvas.style.marginLeft = offsetX + 'px';
  canvas.style.marginTop = offsetY + 'px';
  // 同步更新远程光标位置
  if (remoteCursor && remoteCursor.visible) positionRemoteCursor();
}

function clampOffset() {
  const wrapper = document.getElementById('canvas-wrapper');
  const displayW = fbW * scale;
  const displayH = fbH * scale;
  const wW = wrapper.clientWidth;
  const wH = wrapper.clientHeight;
  // 如果画面比屏幕小，居中；否则限制不超出边界
  if (displayW <= wW) {
    offsetX = (wW - displayW) / 2;
  } else {
    offsetX = Math.min(0, Math.max(wW - displayW, offsetX));
  }
  if (displayH <= wH) {
    offsetY = (wH - displayH) / 2;
  } else {
    offsetY = Math.min(0, Math.max(wH - displayH, offsetY));
  }
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    isDragging = true;
    isPanning = false;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
    lastPanX = e.touches[0].clientX;
    lastPanY = e.touches[0].clientY;
    // 鼠标按下
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.touches[0].clientX - rect.left) / scale);
    const y = Math.floor((e.touches[0].clientY - rect.top) / scale);
    if (client && client.connected) {
      client.sendPointerEvent(x, y, 1);
    }
  } else if (e.touches.length === 2) {
    // 双指缩放开始
    isDragging = false;
    isPanning = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.sqrt(dx * dx + dy * dy);
    lastPinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    lastPinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  }
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.touches[0].clientX - rect.left) / scale);
    const y = Math.floor((e.touches[0].clientY - rect.top) / scale);
    // 如果缩放 > 1.05，单指拖动 = 平移画布；否则 = 鼠标事件
    if (scale > 1.05) {
      const deltaX = e.touches[0].clientX - lastPanX;
      const deltaY = e.touches[0].clientY - lastPanY;
      offsetX += deltaX;
      offsetY += deltaY;
      clampOffset();
      applyCanvasTransform();
      lastPanX = e.touches[0].clientX;
      lastPanY = e.touches[0].clientY;
    } else {
      if (client && client.connected) {
        client.sendPointerEvent(x, y, 1);
      }
    }
  } else if (e.touches.length === 2 && isPanning) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    if (lastTouchDist > 0) {
      const delta = dist / lastTouchDist;
      // 平滑缩放 (灵敏度 0.02-1.0 无阈值限制)
      const newScale = Math.max(0.15, Math.min(5, scale * delta));
      if (newScale !== scale) {
        // 以缩放中心点为锚点：保持锚点在屏幕上的位置不变
        const wrapper = document.getElementById('canvas-wrapper');
        const anchorScreenX = cx - wrapper.getBoundingClientRect().left;
        const anchorScreenY = cy - wrapper.getBoundingClientRect().top;
        const anchorFbX = (anchorScreenX - offsetX) / scale;
        const anchorFbY = (anchorScreenY - offsetY) / scale;
        scale = newScale;
        offsetX = anchorScreenX - anchorFbX * scale;
        offsetY = anchorScreenY - anchorFbY * scale;
        clampOffset();
        applyCanvasTransform();
        lastPinchCenterX = cx;
        lastPinchCenterY = cy;
        updateZoomIndicator();
      }
      // 双指同时平移
      const panDeltaX = cx - lastPinchCenterX;
      const panDeltaY = cy - lastPinchCenterY;
      if (Math.abs(panDeltaX) > 1 || Math.abs(panDeltaY) > 1) {
        offsetX += panDeltaX;
        offsetY += panDeltaY;
        clampOffset();
        applyCanvasTransform();
        lastPinchCenterX = cx;
        lastPinchCenterY = cy;
      }
    }
    lastTouchDist = dist;
  }
});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (isDragging) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((lastTouchX - rect.left) / scale);
    const y = Math.floor((lastTouchY - rect.top) / scale);
    if (client && client.connected && scale <= 1.05) {
      client.sendPointerEvent(x, y, 0);
    }
  }
  isDragging = false;
  isPanning = false;
  lastTouchDist = 0;
});

// 鼠标事件 (桌面调试)
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / scale);
  const y = Math.floor((e.clientY - rect.top) / scale);
  if (client && client.connected) {
    client.sendPointerEvent(x, y, 1);
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (e.buttons > 0) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / scale);
    const y = Math.floor((e.clientY - rect.top) / scale);
    if (client && client.connected) {
      client.sendPointerEvent(x, y, 1);
    }
  }
});

canvas.addEventListener('mouseup', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / scale);
  const y = Math.floor((e.clientY - rect.top) / scale);
  if (client && client.connected) {
    client.sendPointerEvent(x, y, 0);
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / scale);
  const y = Math.floor((e.clientY - rect.top) / scale);
  if (client && client.connected) {
    if (e.deltaY < 0) {
      client.sendPointerEvent(x, y, 8); // 滚轮上
    } else {
      client.sendPointerEvent(x, y, 16); // 滚轮下
    }
    // 释放
    setTimeout(() => {
      if (client && client.connected) client.sendPointerEvent(x, y, 0);
    }, 50);
  }
});

// ====== 键盘事件 ======
document.addEventListener('keydown', (e) => {
  if (!client || !client.connected) return;
  e.preventDefault();
  if (e.key === 'Shift') activeModifiers.shift = true;
  if (e.key === 'Control') activeModifiers.ctrl = true;
  if (e.key === 'Alt') activeModifiers.alt = true;
  if (e.key === 'Meta') activeModifiers.meta = true;

  const keysym = KEYSYM[e.key];
  if (keysym) {
    client.sendKeyEvent(keysym, true);
  } else if (e.key.length === 1) {
    const code = e.key.charCodeAt(0);
    client.sendKeyEvent(code, true);
  }
});

document.addEventListener('keyup', (e) => {
  if (!client || !client.connected) return;
  e.preventDefault();
  if (e.key === 'Shift') activeModifiers.shift = false;
  if (e.key === 'Control') activeModifiers.ctrl = false;
  if (e.key === 'Alt') activeModifiers.alt = false;
  if (e.key === 'Meta') activeModifiers.meta = false;

  const keysym = KEYSYM[e.key];
  if (keysym) {
    client.sendKeyEvent(keysym, false);
  } else if (e.key.length === 1) {
    const code = e.key.charCodeAt(0);
    client.sendKeyEvent(code, false);
  }
});

// ====== 虚拟键盘 ======
document.querySelectorAll('.kb-key').forEach(btn => {
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const key = btn.dataset.key;
    const mod = btn.dataset.mod;
    if (mod) {
      activeModifiers[mod] = !activeModifiers[mod];
      btn.classList.toggle('active');
      if (client && client.connected) {
        client.sendKeyEvent(KEYSYM[key], activeModifiers[mod]);
      }
    } else if (key === 'CtrlAltDel') {
      if (client && client.connected) {
        client.sendKeyEvent(0xffe3, true);  // Ctrl
        client.sendKeyEvent(0xffe9, true);  // Alt
        client.sendKeyEvent(0xffff, true);  // Del
        client.sendKeyEvent(0xffff, false);
        client.sendKeyEvent(0xffe9, false);
        client.sendKeyEvent(0xffe3, false);
      }
    } else {
      if (client && client.connected) {
        client.sendKeyEvent(KEYSYM[key], true);
        setTimeout(() => {
          if (client && client.connected) client.sendKeyEvent(KEYSYM[key], false);
        }, 100);
      }
    }
  });
});

// 窗口自适应
window.addEventListener('resize', () => {
  if (fbW > 0) resizeCanvas();
});

// 自动填充服务器地址
document.getElementById('input-host').addEventListener('input', () => {
  statusText.textContent = '输入服务器地址开始连接';
  statusText.className = '';
});
</script>
