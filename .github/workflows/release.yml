name: Build and Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: dist:mac
          - os: windows-latest
            platform: win
            script: dist:win
          - os: ubuntu-latest
            platform: linux
            script: dist:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup macOS build env
        if: matrix.os == 'macos-latest'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          echo "CSC_FOR_PULL_REQUEST=false" >> $GITHUB_ENV

      - name: Setup Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # 逐包安装并容错，避免单个包名缺失导致整体失败
          for pkg in \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 rpm squashfs-tools fakeroot \
            libasound2t64 libasound2 libfuse2t64 libfuse2 fuse; do
            sudo apt-get install -y "$pkg" 2>/dev/null || echo "::: skip $pkg"
          done

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Package (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: false
        run: npm run ${{ matrix.script }}

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
          if-no-files-found: warn

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Prepare Capacitor Android project
        shell: bash
        run: |
          set -e
          # 确保移动端 web 资源就位
          mkdir -p capacitor/web
          cp src/mobile/index.html capacitor/web/

          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          # 生成 Capacitor Android 原生工程
          if [ ! -d android ]; then
            yes | npx cap add android 2>&1 | tail -40 || { echo "::: cap add android 失败，输出以上日志"; }
          fi

          # 同步 web 资源到 Android 工程
          npx cap sync android 2>&1 | tail -40 || true

          # 确保 gradlew 存在
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          else
            echo "::: android/gradlew 未生成，尝试安装 gradle 生成 wrapper"
            which gradle >/dev/null 2>&1 || sudo apt-get install -y gradle || true
          fi

      - name: Assemble Android Debug APK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            # 首次在本机生成 wrapper（如缺失）
            ./gradlew --version >/dev/null 2>&1 || {
              echo "::: gradlew 不可用，重新生成 wrapper"
              cd .. && rm -rf android/gradle/wrapper/gradle-wrapper.jar android/gradlew && cd android
              gradle wrapper --gradle-version 8.5 2>&1 | tail -20 || true
              chmod +x gradlew
            }
            ./gradlew :app:assembleDebug --no-daemon -x lint 2>&1 | tail -60
            cd ..
            echo "::: APK 产物:"
            find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) | xargs ls -la 2>/dev/null || echo "未找到 APK"
          else
            echo "WARN: android/gradlew 不存在，跳过 APK 构建"
            mkdir -p android/app/build/outputs/apk/debug
            touch android/app/build/outputs/apk/debug/placeholder-not-built.log
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release asset folder
        run: |
          mkdir -p release-artifacts
          find artifacts -type f -not -name "*.log" | xargs -I{} cp -f {} release-artifacts/ 2>/dev/null || true
          ls -la release-artifacts/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-artifacts/*
