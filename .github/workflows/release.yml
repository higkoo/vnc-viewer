name: Build and Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: dist:mac
          - os: windows-latest
            platform: win
            script: dist:win
          - os: ubuntu-latest
            platform: linux
            script: dist:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup macOS build env
        if: matrix.os == 'macos-latest'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          echo "CSC_FOR_PULL_REQUEST=false" >> $GITHUB_ENV

      - name: Setup Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # 安装所有依赖，单个包缺失不阻断整体
          for pkg in \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 rpm squashfs-tools \
            fakeroot dpkg-dev dpkg \
            libasound2t64 libasound2 libfuse2t64 libfuse2 fuse; do
            echo "::: installing $pkg ..."
            sudo apt-get install -y "$pkg" || echo "::: skip $pkg (not found)"
          done
          # 验证关键依赖
          echo "::: verify fakeroot: $(which fakeroot || echo MISSING)"
          echo "::: verify dpkg-deb: $(which dpkg-deb || echo MISSING)"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Package (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: false
        run: npm run ${{ matrix.script }}

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
          if-no-files-found: warn

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          # compileSdk=36（见 android/variables.gradle），必须安装 android-36 + 对应 build-tools
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Prepare Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          
          # 查找 Android SDK 路径
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_PATH" ]; then
            # 尝试从 setup-android action 的默认路径查找
            SDK_PATH="$HOME/.android/sdk"
            [ -d "$SDK_PATH" ] || SDK_PATH="/usr/local/lib/android/sdk"
            [ -d "$SDK_PATH" ] || SDK_PATH="/opt/android/sdk"
          fi
          echo "SDK_PATH=${SDK_PATH}"
          echo "ANDROID_HOME=${SDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${SDK_PATH}" >> $GITHUB_ENV
          export ANDROID_HOME="$SDK_PATH"
          export ANDROID_SDK_ROOT="$SDK_PATH"

          # 准备移动端 web 资源
          mkdir -p capacitor/web
          cp src/mobile/index.html capacitor/web/

          # android/ 原生工程已提交到仓库，只需同步 web 资源（Capacitor 会在 android 目录存在时更新 assets/plugins）
          npx cap sync android 2>&1

          # 写入 local.properties 确保 Gradle 能找到 SDK
          echo "sdk.dir=${SDK_PATH}" > android/local.properties
          cat android/local.properties

          # 确保 gradlew 可执行（已随 android/ 提交）
          chmod +x android/gradlew || { echo "FATAL: android/gradlew 缺失"; exit 1; }
          echo "::: Android 工程准备完成"

      - name: Assemble Android Debug APK
        shell: bash
        run: |
          set -euo pipefail
          # 从环境变量或 local.properties 获取 SDK 路径
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=${SDK_PATH}"
          export ANDROID_HOME="$SDK_PATH"
          export ANDROID_SDK_ROOT="$SDK_PATH"

          if [ ! -f android/gradlew ]; then
            echo "FATAL: android/gradlew 不存在"
            exit 1
          fi

          cd android
          chmod +x gradlew
          
          # 确保 local.properties 存在
          [ -f local.properties ] || echo "sdk.dir=${SDK_PATH}" > local.properties
          
          echo "::: Gradle 版本:"
          ./gradlew --version
          echo "::: 开始构建 APK..."
          ./gradlew :app:assembleDebug --no-daemon -x lint 2>&1
          cd ..
          
          echo "::: APK 产物列表:"
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -la {} \; 2>/dev/null || echo "未找到 APK"
          
          # 如果没有 APK，报错
          APK_COUNT=$(find android/app/build/outputs -type f -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "FATAL: 没有生成任何 APK 文件"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release asset folder
        run: |
          mkdir -p release-artifacts
          find artifacts -type f -not -name "*.log" | xargs -I{} cp -f {} release-artifacts/ 2>/dev/null || true
          ls -la release-artifacts/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-artifacts/*
