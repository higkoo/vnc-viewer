name: Build and Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: dist:mac
          - os: windows-latest
            platform: win
            script: dist:win
          - os: ubuntu-latest
            platform: linux
            script: dist:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup macOS build env
        if: matrix.os == 'macos-latest'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          echo "CSC_FOR_PULL_REQUEST=false" >> $GITHUB_ENV

      - name: Setup Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # 逐包安装并容错，避免单个包名缺失导致整体失败
          for pkg in \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 rpm squashfs-tools fakeroot \
            libasound2t64 libasound2 libfuse2t64 libfuse2 fuse; do
            sudo apt-get install -y "$pkg" 2>/dev/null || echo "::: skip $pkg"
          done

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Package (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: false
        run: npm run ${{ matrix.script }}

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
          if-no-files-found: warn

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Prepare Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          
          # 确保 ANDROID_HOME 和 ANDROID_SDK_ROOT 已设置
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV

          # 准备移动端 web 资源
          mkdir -p capacitor/web
          cp src/mobile/index.html capacitor/web/

          # 清空可能存在的空 android 目录，让 cap add 重新生成
          if [ -d android ] && [ -z "$(ls -A android 2>/dev/null)" ]; then
            rmdir android
          fi

          # 生成 Capacitor Android 原生工程
          npx cap add android --skip-install 2>&1 || {
            echo "::: cap add android 失败，尝试不带 skip-install"
            npx cap add android 2>&1
          }

          # 同步 web 资源
          npx cap sync android 2>&1

          # 确保 gradlew 可执行
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          else
            echo "::: android/gradlew 未生成，手动生成 wrapper"
            cd android
            gradle wrapper --gradle-version 8.5 2>&1 || {
              echo "::: gradle 未安装，通过 apt 安装"
              sudo apt-get install -y gradle
              gradle wrapper --gradle-version 8.5 2>&1
            }
            chmod +x gradlew
            cd ..
          fi
          echo "::: Android 工程准备完成"

      - name: Assemble Android Debug APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          if [ ! -f android/gradlew ]; then
            echo "FATAL: android/gradlew 不存在"
            exit 1
          fi

          cd android
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :app:assembleDebug --no-daemon -x lint 2>&1
          cd ..
          
          echo "::: APK 产物列表:"
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -la {} \; 2>/dev/null || echo "未找到 APK"
          
          # 如果没有 APK，报错
          APK_COUNT=$(find android/app/build/outputs -type f -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "FATAL: 没有生成任何 APK 文件"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release asset folder
        run: |
          mkdir -p release-artifacts
          find artifacts -type f -not -name "*.log" | xargs -I{} cp -f {} release-artifacts/ 2>/dev/null || true
          ls -la release-artifacts/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-artifacts/*
